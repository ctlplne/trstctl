name: Bug report
description: Something in trstctl behaves differently from what the docs say.
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Not a bug report? Vulnerabilities go to
        [SECURITY.md](https://github.com/ctlplne/trstctl/blob/main/SECURITY.md),
        never to a public issue. Missing behaviour may be a known not-yet-served
        subsystem — see
        [docs/limitations.md](https://github.com/ctlplne/trstctl/blob/main/docs/limitations.md).

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `trstctl version`, or the commit SHA you built.
      placeholder: v0.4.1 (or 9f3c1ab)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or requests, from a clean start if you can.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Redact secrets, tokens, and private keys before pasting.
      render: shell
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, how trstctl is deployed, PostgreSQL version.
      placeholder: linux/amd64, docker compose, PostgreSQL 16
    validations:
      required: false
