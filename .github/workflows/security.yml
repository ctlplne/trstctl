name: Security scans

# Secret scanning (gitleaks) and container-image vulnerability scanning (Trivy),
# wired as required checks so a planted secret or a vulnerable base image cannot
# merge (SF.1). Dependency scanning is covered by the govulncheck job in ci.yml
# and by Dependabot alerts (version-update PRs are off in .github/dependabot.yml);
# SAST by codeql.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "v8.27.2"
  TRIVY_VERSION: "0.71.1"

# Every actions/setup-go step sets GOTOOLCHAIN=local for itself only: setup-go
# installs go.mod's `go` version, and with the default GOTOOLCHAIN=auto its own
# `go env` fetched the `toolchain` line's newer Go into the module cache before
# the cache restore, which then failed on those files ("Cannot open: File
# exists"), so no job restored a cache. Later steps still switch to the toolchain
# line's version (docs/ci_test_lanes_test.go keeps every setup-go step this way).
jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # scan full history, not just the tip

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        env:
          GOTOOLCHAIN: local # see the note at the top of this workflow
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Prefetch dependencies (retries a transient module-proxy failure)
        run: scripts/ci/go-mod-download.sh

      - name: Install gitleaks with trstctl installer
        id: install-gitleaks
        env:
          GOBIN: ${{ runner.temp }}/trstctl-gitleaks-bin
          TRSTCTL_GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          bin="$(tools/gitleaks/install.sh)"
          echo "bin=${bin}" >> "$GITHUB_OUTPUT"
          "${bin}" version

      - name: Served Gitleaks scan smoke
        env:
          TRSTCTL_GITLEAKS_BIN: ${{ steps.install-gitleaks.outputs.bin }}
        run: go test ./internal/secretscan ./internal/server -run 'Test(ServedGitleaksScanDetectsPlantedSecret|ServedDeepSecretScanCAPSCAN03UsesHistoryAndCustomRules|ParseGitleaks)' -count=1

      # `detect` scans the committed history; `--no-banner --redact` keeps logs
      # clean and never echoes a matched secret. Non-zero exit (a finding) fails
      # the job. The config (.gitleaks.toml) allowlists ONLY the published
      # connector conformance key body; there is no path exemption, and known
      # fixtures are pinned per finding in .gitleaksignore.
      - name: Scan repository for secrets
        run: ${{ steps.install-gitleaks.outputs.bin }} detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  image-scan:
    name: container image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # TEST-004 (builds the image, then Trivy-scans it)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve the distroless runtime base by digest (pin, not tag)
        id: base
        run: |
          set -euo pipefail
          base="gcr.io/distroless/static-debian12:nonroot"
          digest="$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')"
          echo "ref=gcr.io/distroless/static-debian12@${digest}" >> "$GITHUB_OUTPUT"

      - name: Build the runtime image from the digest-pinned base
        run: |
          set -euo pipefail
          docker build \
            --target release \
            --build-arg BASE_IMAGE='${{ steps.base.outputs.ref }}' \
            -f deploy/docker/Dockerfile \
            -t trstctl:ci-scan .

      - name: Install Trivy (pinned + checksum-verified)
        run: |
          set -euo pipefail
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          # Each download retries a failed transfer (GitHub release downloads
          # answer 5xx in bursts) before the job gives up.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 "${base}/${file}" -o "/tmp/${file}"
          # Verify the downloaded tarball against the digest upstream published for
          # this exact release (trivy_<ver>_checksums.txt), pinned by version. A
          # corrupted or swapped download fails `sha256sum -c` and the job stops —
          # we never tar/install unverified bytes (SUPPLY-006).
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 "${base}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          ( cd /tmp && grep " ${file}\$" trivy_checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${file}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # Fail the build on any fixable HIGH/CRITICAL OS or library vulnerability
      # in the assembled image (this is what catches a vulnerable base image).
      - name: Scan the image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            trstctl:ci-scan

      - name: Verify the production image base is digest-pinned (not a floating tag)
        run: bash scripts/ci/check-base-pinned.sh

      # Pin policy, part three: the SHIPPED STACKS. check-base-pinned.sh covers only
      # the production image's own bases; this covers every other image deploy/
      # references — the compose stacks, the demo seed Dockerfile, the IaC job
      # manifests — so an evaluator's first `docker compose up` cannot pull a
      # silently-changed image (SUPPLY-008).
      - name: Verify deploy/ stack images are digest-pinned (not floating tags)
        run: |
          bash scripts/ci/check-compose-images-pinned_selftest.sh
          bash scripts/ci/check-compose-images-pinned.sh .

      # Supply-chain pin policy, part two: every third-party GitHub Action is
      # pinned by an immutable commit SHA, never a mutable tag (SUPPLY-002). The
      # release pipeline holds packages:write + id-token:write, so a repointed
      # action tag is an OIDC-token / image-push risk.
      - name: Verify third-party actions are SHA-pinned (not floating tags)
        run: |
          bash scripts/ci/check-actions-pinned_selftest.sh
          bash scripts/ci/check-actions-pinned.sh .
