name: Trust audit

# Part 3 of the eMudhra response (2026-10): every image's trust store, read the
# way Go reads it, compared daily with Mozilla's current websites trust list
# from CCADB and with the shipped distrust list. This is the one workflow that
# uses the network for trust data; ordinary builds and pull requests do not.
# A root Mozilla drops is a distrust-file entry the same day; the pinned Alpine
# bundle moves when Alpine ships a new one.
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-audit:
    name: image trust stores vs Mozilla
    runs-on: ubuntu-latest
    timeout-minutes: 45 # TEST-004 (eight image builds)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Audit every image against Mozilla's websites list and the distrust list
        run: make trust-audit

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trust-audit-reports
          path: .sandbox-build/trust-audit/*.json
          if-no-files-found: ignore
