          if-no-files-found: error

  compose-e2e:
    name: compose e2e + PKI conformance (EXC-GATE-01)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # TEST-004 (stands up the full eval stack)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # No host-side trstctl build: the bootstrap API token is minted INSIDE the
      # running control-plane container (the compose Postgres has no host port), so the
      # gate needs only docker + curl + jq + openssl, all present on the runner.
      - name: Prepare PKI profile artifact directories
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/profile-lint-fixtures" "${RUNNER_TEMP}/profile-lint-zlint"
          printf '%s\n' "Profile lint fixtures are generated later in this job." > "${RUNNER_TEMP}/profile-lint-fixtures/README.txt"
          printf '%s\n' "zlint reports are generated later in this job." > "${RUNNER_TEMP}/profile-lint-zlint/README.txt"
      - name: Bring up the served eval stack
        run: |
          # --build so we exercise THIS commit's image, not a stale pulled :latest.
          docker compose -f deploy/docker/docker-compose.yml up -d --build
          # Fail loud: poll /readyz and, if the control plane never serves within the
          # budget, dump the stack logs and FAIL the job (do not silently proceed to a
          # curl that connection-refuses). The control plane self-heals a first-boot
          # signer/KEK race via restart:on-failure, so allow generous time.
          ready=""
          for _ in $(seq 1 90); do
            if curl -fsk https://localhost:8443/readyz >/dev/null 2>&1; then ready=1; echo "control plane ready"; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::control plane did not serve /readyz within the budget"
            docker compose -f deploy/docker/docker-compose.yml ps
            docker compose -f deploy/docker/docker-compose.yml logs --no-color --tail=300
            exit 1
          fi
      - name: Issuance lifecycle e2e (issue -> idempotent retry -> revoke -> ACME/OCSP/cacerts)
        env:
          BASE_URL: https://localhost:8443
        run: bash scripts/ci/compose-e2e.sh
      - name: PKI profile conformance (zlint emitted-profile corpus)
        env:
          TRSTCTL_PROFILE_LINT_FIXTURE_DIR: ${{ runner.temp }}/profile-lint-fixtures
        run: |
          go install github.com/zmap/zlint/v3/cmd/zlint@v3.6.0
          mkdir -p "${TRSTCTL_PROFILE_LINT_FIXTURE_DIR}" "${RUNNER_TEMP}/profile-lint-zlint"
          go test ./internal/ca/profilelint -run TestArchiveProfileLintFixturesWritesCorpus -count=1 -v
          # served-ca.pem is the issuing CA chain the deployment serves over EST
          # /cacerts, written by the e2e step above. The fixture directory adds the
          # emitted leaf shapes (served leaf, mTLS agent certs, SPIFFE SVID, TSA).
          # Gate on RFC 5280 error-level findings, not CABF public-trust policy.
          bash scripts/ci/profile-zlint.sh served-ca.pem "${TRSTCTL_PROFILE_LINT_FIXTURE_DIR}" "${RUNNER_TEMP}/profile-lint-zlint"
      - name: Upload PKI profile zlint corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pki-profile-zlint-corpus
          path: |
            ${{ runner.temp }}/profile-lint-fixtures
            ${{ runner.temp }}/profile-lint-zlint
          if-no-files-found: error
      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker/docker-compose.yml ps || true
          docker compose -f deploy/docker/docker-compose.yml logs --no-color --tail=400 || true
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml down -v || true

  windows-build:
    name: windows cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 20 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Cross-compile and vet the whole module for Windows so the CryptoAPI
      # certificate store and the Service Control Manager integration are kept
      # building. The agent's Windows binary and signed MSI are produced by the
      # release pipeline (make dist-windows), not on every PR.
      - name: Cross-build for Windows (amd64)
        run: make windows-build

  # FIPS-capable build gate (PKIGOV-007 / EXC-CRYPTO-01). It builds all three
  # binaries with the Go FIPS 140-3 Cryptographic Module enabled (GOFIPS140), then
  # PROVES the produced binary actually has the module active (not merely that it
  # compiled) and that the --fips power-on self-test boots cleanly. It also runs
  # the internal/crypto FIPS suite under the FIPS build so the required+active POST
  # path is exercised. This is FIPS-*capable* (validated Go module); the trstctl
  # product NIST CMVP certificate is a separate, external process named in
  # docs/compliance.md and is NOT asserted here.
  fips-build:
    name: fips-capable build (GOFIPS140)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # version stamping

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Builds all three binaries with the pinned regulated selector
      # GOFIPS140=v1.0.0 and self-verifies the
      # control plane reports `crypto.fips.module_active: true` (fails the job
      # otherwise — a build whose module is inactive is not FIPS-capable).
      - name: FIPS-capable build (+ verify module active)
        run: make fips-build

      # The required+active power-on self-test path: under the FIPS module,
      # PowerOnSelfTest(required=true) must pass. The non-FIPS fail-closed path is
      # covered by the default build/test job above.
      - name: FIPS power-on self-test suite (module active)
        env:
          GOFIPS140: v1.0.0
        run: go test ./internal/crypto/ -run 'TestPowerOnSelfTest|TestSelfTestKAT|TestFIPSStatus' -count=1 -v

  windows:
    name: windows / test + MSI
    runs-on: windows-latest
    timeout-minutes: 40 # TEST-004 (native Windows build + WiX MSI is slow)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      # Run the Windows-specific surface natively: the agent — including the
      # real CryptoAPI certificate store, which installs into the per-user store
      # and asserts the key association — the destinations, the release checksum
      # helper, and the crypto boundary. The PostgreSQL/NATS integration tests
      # stay on the Linux job.
      - name: Test (Windows agent surface, incl. real certificate store)
        run: go test ./internal/agent/... ./internal/dist/... ./internal/crypto/...

      - name: Build MSI (WiX v3)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -o dist\trstctl-agent.exe .\cmd\trstctl-agent
          choco install wixtoolset --no-progress -y
          $wixDir = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset *' |
            Sort-Object Name -Descending | Select-Object -First 1
          $bin = Join-Path $wixDir.FullName 'bin'
          Copy-Item deploy\windows\trstctl-agent.wxs dist\trstctl-agent.wxs
          & "$bin\candle.exe" -arch x64 -out dist\ dist\trstctl-agent.wxs
          & "$bin\light.exe" -b dist -out dist\trstctl-agent.msi dist\trstctl-agent.wixobj
          Get-ChildItem dist

      # CI builds the Windows package but does not Authenticode-sign it. Release
      # signing happens only in the protected `agent-windows` release job through
      # a remote OIDC-authenticated signer, so CI never materializes code-signing
      # private-key material on a runner (SUPPLY-002).
      - name: Note unsigned CI artifact
        shell: pwsh
        run: |
          Write-Host '::notice::Windows CI artifacts are intentionally unsigned; release.yml signs through the protected remote Authenticode signer.'

      - name: Publish SHA-256 sums
        shell: pwsh
        run: |
          Get-FileHash dist\trstctl-agent.exe, dist\trstctl-agent.msi -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Tee-Object -FilePath dist\SHA256SUMS

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trstctl-agent-windows
          path: |
            dist/trstctl-agent.exe
            dist/trstctl-agent.msi
            dist/SHA256SUMS

  kubernetes:
    name: kubernetes / kind e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40 # TEST-004 (provisions a kind cluster + cert-manager CRDs)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: trstctl-e2e

      # Install real cert-manager, not only the CRDs: DIST-01 exercises a
      # Certificate -> CertificateRequest -> trstctl ClusterIssuer -> Secret
      # flow through cert-manager's controller loop.
      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl -n cert-manager rollout status deploy/cert-manager --timeout=180s
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s
          kubectl -n cert-manager rollout status deploy/cert-manager-cainjector --timeout=180s
          kubectl wait --for=condition=Established --timeout=60s crd/certificaterequests.cert-manager.io
          kubectl wait --for=condition=Established --timeout=60s crd/certificates.cert-manager.io

      - name: Provision agent RBAC and an admin token for fixtures
        run: |
          kubectl apply -f deploy/kubernetes/namespace.yaml
          kubectl apply -f deploy/kubernetes/certmanager-issuer-crds.yaml
          kubectl apply -f deploy/kubernetes/rbac.yaml
          kubectl -n trstctl create serviceaccount trstctl-e2e-admin
          kubectl create clusterrolebinding trstctl-e2e-admin --clusterrole=cluster-admin --serviceaccount=trstctl:trstctl-e2e-admin

      - name: Validate packaged agent DaemonSet apply path
        shell: bash
        run: |
          set -euo pipefail
          ca_bundle="$(mktemp)"
          rendered_agent_daemonset="$(mktemp)"
          kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 --decode > "$ca_bundle"
          kubectl -n trstctl create secret generic trstctl-agent-bootstrap \
            --from-literal=token=ci-dry-run-token \
            --dry-run=client -o yaml | kubectl apply --dry-run=server -f -
          kubectl -n trstctl create configmap trstctl-ca-bundle \
            --from-file=ca-bundle.pem="$ca_bundle" \
            --dry-run=client -o yaml | kubectl apply --dry-run=server -f -
          kubectl -n trstctl create secret generic trstctl-cert-manager-issuer \
            --from-literal=signer-url=https://trstctl:8443/api/v1/ca/authorities/e2e/issue \
            --from-literal=token=ci-dry-run-token \
            --dry-run=client -o yaml | kubectl apply --dry-run=server -f -
          scripts/release/render-kubernetes-agent-daemonset.sh \
            "ghcr.io/ctlplne/trstctl@sha256:1111111111111111111111111111111111111111111111111111111111111111" \
            > "$rendered_agent_daemonset"
          kubectl apply --dry-run=server -f "$rendered_agent_daemonset"

      - name: Run the in-cluster e2e (secret write + cert-manager bridge)
        shell: bash
        run: |
          set -euo pipefail
          # Assign then export separately so a command substitution failure is
          # not masked by export's exit status (shellcheck SC2155).
          K8S_SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          # Agent token: the restricted identity the code under test uses.
          K8S_TOKEN="$(kubectl -n trstctl create token trstctl-agent --duration=1h)"
          # Admin token: test fixtures and verification (the agent SA cannot
          # create CertificateRequests, by design).
          K8S_ADMIN_TOKEN="$(kubectl -n trstctl create token trstctl-e2e-admin --duration=1h)"
          K8S_CA_FILE="$(mktemp)"
          kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 --decode > "$K8S_CA_FILE"
          K8S_NAMESPACE="trstctl"
          export K8S_SERVER K8S_TOKEN K8S_ADMIN_TOKEN K8S_CA_FILE K8S_NAMESPACE
          go test -tags e2e -count=1 -v ./test/e2e/kubernetes/...

      - name: Diagnostics on failure
        if: failure()
        run: kubectl get certificaterequests,secrets -A || true

  # A0.3f: the PQC census proofs run on every push instead of hiding behind a
  # locally-invoked build tag. The rows drive the EXACT shipped artifact: a
  # stock OpenSSL client enrolls a pure ML-DSA-65 CSR through EST, the
  # Workload API returns the two-entry hybrid SVID response, and the
  # CBOM→migration rollout applies and rolls back a TLS finding. The proofs
  # REQUIRE an ML-DSA-capable stock OpenSSL (>= 3.5); the gate fails loud on
  # runner drift instead of letting the proof silently vanish (CODE-005).
  pqc-dodproof:
    name: pqc e2e (dodproof)
    runs-on: ubuntu-latest
    timeout-minutes: 40 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Require ML-DSA-capable stock OpenSSL
        run: |
          set -euo pipefail
          openssl version
          if ! openssl list -signature-algorithms | grep -q "ML-DSA-65"; then
            echo "::error::runner OpenSSL lacks ML-DSA-65; the PQC census proofs need OpenSSL >= 3.5. Pin a capable runner image or build OpenSSL 3.5 in this job."
            exit 1
          fi

      - name: PQC census proofs against the shipped artifact
        run: go test -tags trstctl_dodproof -count=1 -v -run 'TestDODPQCProductionAssembly' ./cmd/trstctl/

  spire-e2e:
    name: spire container e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run SPIRE upstream-authority container e2e
        env:
          TRSTCTL_RUN_SPIRE_E2E: "1"
        run: go test -tags e2e -count=1 -v ./test/e2e/spire/...

  # S-C8: the component workbench must keep building — stories render against
  # the real tokens, so a broken story or token regression fails here. Marked
  # advisory in branch protection (not a required check) while it beds in.
  web-storybook:
    name: web storybook (workbench build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the static workbench
        run: npm run storybook:build

  # S-C4: browser e2e against the seeded demo stack. Manual-only
  # (workflow_dispatch) because it needs Docker plus a browser install, which is
  # too heavy for the per-PR path. Scope is the shell smoke spec: visual
  # regression (e2e/visual.spec.ts) is local-only by design, because this runner
  # is ubuntu-latest and could only ever record or compare -linux baselines. See
  # web/DESIGN.md and docs/visual_baselines_test.go (CODE-109).
  web-e2e:
    name: web e2e (Playwright shell smoke, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start the seeded demo stack
        working-directory: .
        run: docker compose -f deploy/demo/docker-compose.yml up -d --build

      - name: Wait for the control plane
        working-directory: .
        run: |
          for i in $(seq 1 60); do
            curl -skf https://localhost:9443/ >/dev/null && exit 0
            sleep 5
          done
          echo "demo stack did not become ready" >&2
          docker compose -f deploy/demo/docker-compose.yml logs --no-color --tail=200
          exit 1

      - name: Shell smoke
        run: npm run e2e -- e2e/shell.spec.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      - name: Demo stack logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f deploy/demo/docker-compose.yml logs --no-color --tail=300
