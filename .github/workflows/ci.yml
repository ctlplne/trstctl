name: CI

# Build, test, and lint the module on every pull request and on pushes to main.
# The nightly schedule drives the deeper fuzz budget (FUZZ-003); per-PR runs use a
# short smoke budget so the regression net is exercised on every change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily — the longer nightly fuzz pass.
    - cron: "17 3 * * *"

# Least-privilege token: CI only needs to read the repository.
permissions:
  contents: read

env:
  NPM_AUDIT_VERSION: "11.16.0"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build / test / lint
    runs-on: ubuntu-latest
    # Per-job timeout so a hung embedded-PG/NATS/signer integration job fails fast
    # instead of burning the 6-hour GitHub default (TEST-004).
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history so `git describe` can stamp the version

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node for SDK generators
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify Java SDK toolchain
        run: |
          javac -version
          java -version

      - name: Build
        run: make build

      - name: Smoke test (--version boots and exits cleanly)
        run: ./bin/trstctl --version

      - name: Test
        # TRSTCTL_REQUIRE_OPENSSH=1 forces the stock-OpenSSH SSH-certificate
        # cross-checks (ssh-keygen -L / -Q) to RUN and assert on the runner, which
        # always ships ssh-keygen — so the INTEROP-S3 strength (trstctl SSH certs
        # verify with the reference toolchain) cannot silently regress via a skip.
        env:
          TRSTCTL_REQUIRE_OPENSSH: "1"
        run: make test

      - name: SDK contract and client tests
        env:
          TRSTCTL_REQUIRE_JAVA_SDK: "1"
        run: |
          make sdk-check
          make sdk-test

      # A REAL `terraform apply` drives the provider against the acceptance
      # fixture server, so the provider's plan/apply/read/delete loop cannot
      # regress to a documented-but-unrun claim (B6). The terraform binary is a
      # pinned version verified against HashiCorp's published SHA256SUMS.
      - name: Terraform provider acceptance (real terraform apply)
        run: |
          set -euo pipefail
          TF_VERSION=1.9.8
          curl -fsSLo "${RUNNER_TEMP}/terraform.zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLo "${RUNNER_TEMP}/terraform.sums" "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
          ( cd "${RUNNER_TEMP}" \
            && grep " terraform_${TF_VERSION}_linux_amd64.zip$" terraform.sums \
             | sed "s#terraform_${TF_VERSION}_linux_amd64.zip#terraform.zip#" \
             | sha256sum -c - )
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "${RUNNER_TEMP}/terraform.zip" "${RUNNER_TEMP}/tfbin"
          chmod +x "${RUNNER_TEMP}/tfbin/terraform"
          TRSTCTL_RUN_TERRAFORM_ACC=1 TRSTCTL_TERRAFORM_PATH="${RUNNER_TEMP}/tfbin/terraform" CHECKPOINT_DISABLE=1 \
            go test -count=1 -run TestTerraformApplyCreatesProfileCertificateAndSecret ./internal/terraformprovider/

      - name: Perf smoke SLO gate
        run: scripts/perf/run-local.sh --profile smoke --out "${RUNNER_TEMP}/perf-smoke.json"

      - name: Upload perf smoke SLO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-smoke-slo
          path: ${{ runner.temp }}/perf-smoke.json
          if-no-files-found: error

      - name: Perf capacity calibration gate
        run: scripts/perf/run-capacity-calibration.sh --out "${RUNNER_TEMP}/capacity-measurement-baseline.json"

      - name: Upload perf capacity artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-capacity-calibration
          path: ${{ runner.temp }}/capacity-measurement-baseline.json
          if-no-files-found: error

      # Install the pinned golangci-lint v2 (required for Go 1.26) so the lint
      # step uses a deterministic version rather than the runner's.
      - name: Install lint tooling
        run: make tools

      # `make lint` fails closed if golangci-lint/actionlint are absent rather
      # than silently skipping them (CODE-005). Since `make tools` just installed
      # the pinned tools, this proves the full lint actually ran in CI.
      - name: Lint
        run: make lint

      # PCAS INT-20/23: prove every delivered PCAS mechanism has a production
      # caller and the flagship e2e runs over real PostgreSQL, embedded
      # NATS/JetStream, a cross-process signer, and WASM RP parity.
      - name: PCAS release gate
        run: make pcas-release-gate

      # VDEC INT-WIRE/11: the vdec family gates every PR exactly like the
      # xrec/PCAS family above — caller+wire conformance over real PostgreSQL,
      # embedded NATS, and a cross-process signer, plus vectors, fuzz seeds,
      # traceability, and edition/zero-removal (OPS-CI-103, OPS-CI-104).
      - name: VDEC release gate
        run: make vdec-release-gate

      - name: Editions gate
        run: make editions-gate

      # Patent claim traceability: ee/docs/claim-traceability.md is generated
      # from the claim citations in ee/ Go source. A citation added, moved, or
      # removed without regenerating the committed table fails the build here,
      # and --strict additionally fails on any integrity finding — including a
      # claim whose whole implementation set is a package doc comment.
      - name: Claim traceability check
        run: make claim-traceability-check

      # CWE register/coverage: both documents are generated from the tree's
      # in-source `#nosec G### -- reason` waivers plus the fixed-findings list.
      # A new waiver without a reason, or one added without regenerating the
      # committed pages, fails the build here.
      - name: CWE register and coverage check
        run: make cwe-docs-check

      # CBOM coverage design doc: docs/design/cbom-coverage.md is generated from
      # the observability-envelope registry and the real classifier run over a
      # fixed fixture estate. A source kind, asset class, or unobservable class
      # added without regenerating the committed page fails the build here.
      - name: CBOM coverage design doc check
        run: make cbom-docs-check

      # AGID-INT-CALL STRONG check: an RTA call graph seeded from the cmd/* main.main
      # (built WITHOUT -tags trstctl_core) proves every ee/agentid constructor is
      # reachable from a running binary. The floor tier already ran inside `make lint`
      # (agid-caller-gate); this runs the heavier whole-program reachability proof.
      - name: AGID production-caller gate (strong / RTA)
        run: make agid-caller-gate-strong

      # XREC-INT-CALL STRONG check: same delivered-not-test-only proof for the
      # cross-plane reconciliation family. The lexical floor runs inside `make lint`.
      - name: XREC production-caller gate (strong / RTA)
        run: make xrec-caller-gate-strong

      # VDEC-INT-CALL STRONG check: same delivered-not-test-only proof for the
      # verifiable decommissioning family. The lexical floor runs inside `make lint`.
      - name: VDEC production-caller gate (strong / RTA)
        run: make vdec-caller-gate-strong

      # PCAS-INT-CALL STRONG check: same delivered-not-test-only proof for the
      # post-compromise automated succession family. The lexical floor + seam run
      # inside `make lint` (pcas-caller-gate).
      - name: PCAS production-caller gate (strong / RTA)
        run: make pcas-caller-gate-strong

      # XREC-INT-WIRE: run the real-substrate integration suite over PostgreSQL/RLS,
      # embedded file-backed NATS/JetStream, the outbox, and the real signer process.
      - name: XREC wire integration gate
        run: make xrec-wire-gate

      # XREC-13: published vectors, differential verifier agreement, decode fuzz
      # smoke, edition/zero-removal assertions, and the three-plane offline-chain e2e.
      - name: XREC release gate
        run: make xrec-release-gate

      # Verify the CI gates' own logic (the critical-package coverage evaluator
      # and the base-image digest-pinning guard) so a regression in a gate is
      # caught here rather than silently weakening the build (SF.1).
      - name: Gate self-tests
        run: |
          bash scripts/ci/coverage-normalize_selftest.sh
          bash scripts/ci/coverage-critical_selftest.sh
          bash scripts/ci/coverage-server-lifecycle_selftest.sh
          bash scripts/ci/check-base-pinned_selftest.sh
          bash scripts/ci/verify-branch-protection_selftest.sh
          bash scripts/ci/verify-required-checks_selftest.sh
          bash scripts/ci/verify-scheduled-gates_selftest.sh
          bash scripts/ci/profile-zlint_selftest.sh
          bash scripts/ci/check-compose-images-pinned_selftest.sh
          bash scripts/ci/check-base-pinned.sh .
          bash scripts/ci/check-compose-images-pinned.sh .

  dod-gate:
    name: definition of done / wiring census
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run the shipped-binary Definition-of-Done census
        run: make dod-gate

      - name: Verify journey served badges against the fresh census
        run: make journey-census-check

      - name: Upload wiring census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wiring-census
          path: wiring-census.json
          if-no-files-found: error

  captured-soak:
    name: captured soak / leak gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Nightly runs the REAL multi-hour sustained-load soak (OPS-SOAK-REAL-001);
    # workflow_dispatch keeps the short profile for on-demand smoke.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Capture real sustained-load series
        env:
          SOAK_CAPTURE_PROFILE: nightly-captured-soak
          # 480 x 15s = 2h of real sustained load on the nightly schedule
          # (OPS-SOAK-REAL-001); dispatch keeps the 6-minute smoke shape.
          SOAK_CAPTURE_SAMPLES: ${{ github.event_name == 'schedule' && '480' || '24' }}
          SOAK_CAPTURE_STEP_SECONDS: "15"
          SOAK_CAPTURE_LOAD_SAMPLES: ${{ github.event_name == 'schedule' && '160' || '8' }}
        run: scripts/perf/capture-soak-series.sh --out "${RUNNER_TEMP}/soak-series.json"

      - name: Analyze captured soak trend
        run: scripts/perf/soak.sh --in "${RUNNER_TEMP}/soak-series.json" --out "${RUNNER_TEMP}/soak-trend.json" --profile nightly-captured-soak

      - name: Verify induced leak substitute fails
        run: |
          if scripts/perf/soak.sh --selftest-fail --out "${RUNNER_TEMP}/soak-induced-leak.json" --profile induced-leak-substitute; then
            echo "FAIL: soak gate accepted an induced leak substitute" >&2
            exit 1
          fi
          echo ">> soak gate rejected the induced leak substitute"

      - name: Upload captured soak artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captured-soak-trend
          path: |
            ${{ runner.temp }}/soak-series.json
            ${{ runner.temp }}/soak-trend.json
            ${{ runner.temp }}/soak-induced-leak.json
          if-no-files-found: error

  spine-burst:
    name: spine burst / replay-outbox gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Capture CAP-SMALL spine burst
        run: scripts/perf/run-spine-burst.sh --profile cap-small --out "${RUNNER_TEMP}/spine-burst-cap-small.json"

      - name: Analyze spine burst trend
        run: scripts/perf/soak.sh --in "${RUNNER_TEMP}/spine-burst-cap-small.json" --out "${RUNNER_TEMP}/spine-burst-trend.json" --profile spine-burst-cap-small

      - name: Upload spine burst artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spine-burst-trend
          path: |
            ${{ runner.temp }}/spine-burst-cap-small.json
            ${{ runner.temp }}/spine-burst-trend.json
          if-no-files-found: error

  branch-protection-drift:
    name: branch protection / live policy drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # TEST-001 (live policy must match the committed gate)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify live branch protection matches the committed policy
        env:
          GH_TOKEN: ${{ secrets.TRSTCTL_BRANCH_PROTECTION_READ_TOKEN || github.token }}
          TRSTCTL_BRANCH_PROTECTION_RECEIPT: ${{ runner.temp }}/branch-protection-drift-receipt.json
        run: scripts/ci/verify-branch-protection.sh

      - name: Upload live branch-protection drift receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branch-protection-live-drift-receipt
          path: ${{ runner.temp }}/branch-protection-drift-receipt.json
          if-no-files-found: error

  # TEST-VAULT-001: prove the Vault-compat shim against a REAL vault/openbao CLI
  # (a pinned OpenBao binary), non-skipped, as a required check — the acceptance
  # must fail rather than skip when the client is absent.
  vault-compat:
    name: vault compat (real openbao client)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBAO_VERSION: "2.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install pinned OpenBao CLI
        run: |
          set -euo pipefail
          arch="$(uname -m)"; case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; esac
          url="https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}/bao_${OPENBAO_VERSION}_Linux_${arch}.tar.gz"
          curl -sSL -o /tmp/bao.tgz "$url"
          tar -C /usr/local/bin -xzf /tmp/bao.tgz bao
          sudo ln -sf /usr/local/bin/bao /usr/local/bin/vault
          vault version

      - name: Vault-compat acceptance (non-skipped)
        run: make vault-compat-gate

  # TEST-EE-CI-001: exercise the ee/ commercial code on every PR — its unit
  # tests with a coverage floor, plus the vdec wire/release gates over real
  # infrastructure, held to the same required-check discipline as the xrec/PCAS
  # family so EE code cannot rot untested behind the license fence.
  ee:
    name: ee / unit tests + vdec gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: ee/ unit tests (coverage floor)
        run: make ee-test

      - name: VDEC wire + release gates
        run: make vdec-release-gate

  # OPS-RESTORE-001: the full DR loop must work every PR — backup from a
  # populated instance, restore through the shipped binary's flags into a
  # fresh instance, boot it, read old data, issue NEW credentials, and prove a
  # corrupted backup fails the restore closed.
  restore-rehearsal:
    name: restore rehearsal / full DR loop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Full backup -> fresh restore -> boot -> issue (+ corrupted control)
        run: bash scripts/ci/restore-rehearsal.sh

  # OPS-CI-102: the shipped binaries and image layers must rebuild
  # byte/layer-identical on every PR, not only when someone remembers to run it.
  reproducible:
    name: reproducible build (byte-identical rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Reproducible rebuild check
        run: make reproducible-check

  # OPS-CI-101: the served hot-path live load gate (realistic + peak phases).
  # Too load-sensitive for shared per-PR runners, so it runs on the nightly
  # schedule and is promoted to REQUIRED by the scheduled-gates freshness check.
  perf-live:
    name: perf live / served hot-path load gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Live load gate (realistic + peak phases)
        env:
          PERF_LIVE_OUT: ${{ runner.temp }}/perf-live.json
        run: make perf-live

      - name: Upload live perf SLO artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-live-slo
          path: ${{ runner.temp }}/perf-live.json
          if-no-files-found: error

  # OPS-CI-105/106/107 (+ perf-live above): scheduled-only verifiers cannot be
  # per-PR status checks, so this REQUIRED job fails closed unless the latest
  # scheduled CI run is fresh, green, and actually executed every promoted
  # nightly gate (captured soak, spine burst, live branch-protection drift,
  # perf live). A stale, red, missing, or silently-skipped nightly blocks merge.
  scheduled-freshness:
    name: scheduled gates / nightly freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify the promoted nightly gates are fresh and green
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-scheduled-gates.sh

  # Continuous-fuzzing regression net (FUZZ-003). The mandated "fuzz every parser
  # that touches untrusted input" (TEST-FUZZASSERT-001) is only a safety net if it RUNS:
  # this job replays each target's committed seed corpus (under testdata/fuzz, so a
  # known crasher like FUZZ-001's 0x30 0x84 fails fast) and then fuzzes each target
  # for a short budget. The schedule trigger raises the budget for a deeper nightly
  # pass. A new crasher fails CI here instead of shipping.
  fuzz:
    name: fuzz (smoke per-PR, deeper nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # TEST-004 (nightly raises the fuzz budget)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # The in-repo coverage guard (TestEveryUntrustedParserIsFuzzed) fails if any
      # untrusted-input parser lacks a fuzz target, keeping the denominator honest.
      - name: Coverage guard (every untrusted parser is fuzzed)
        run: go test ./internal/crypto/ -run TestEveryUntrustedParserIsFuzzed -count=1

      # Short budget per target on a PR; a longer budget on the nightly schedule.
      - name: Fuzz smoke (all targets; committed seeds first)
        run: make fuzz-smoke FUZZ_SMOKE_TIME=${{ github.event_name == 'schedule' && '120s' || '15s' }}

  # Hosted ClusterFuzzLite / OSS-Fuzz-family run (PROTOCOL-002). The local fuzz
  # smoke job above stays fast and required; this job runs the upstream
  # ClusterFuzzLite build/run actions against the same auto-discovered Go fuzz
  # targets and archives the hosted-run manifest plus any crash/SARIF artifacts.
  clusterfuzzlite:
    name: ClusterFuzzLite / OSS-Fuzz (address)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build ClusterFuzzLite fuzzers (${{ matrix.sanitizer }})
        id: cflite-build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: ${{ matrix.sanitizer }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-build: true

      - name: Run ClusterFuzzLite fuzzers (${{ matrix.sanitizer }})
        id: cflite-run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          sanitizer: ${{ matrix.sanitizer }}
          mode: ${{ github.event_name == 'schedule' && 'batch' || 'code-change' }}
          fuzz-seconds: ${{ github.event_name == 'schedule' && '900' || '180' }}
          output-sarif: true
          parallel-fuzzing: true

      - name: Record ClusterFuzzLite artifact manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/clusterfuzzlite-artifacts"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=clusterfuzzlite"
            echo "check_name=ClusterFuzzLite / OSS-Fuzz (address)"
            echo "sanitizer=${{ matrix.sanitizer }}"
            echo "mode=${{ github.event_name == 'schedule' && 'batch' || 'code-change' }}"
            echo "build_action=google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1"
            echo "run_action=google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1"
            echo "upload_build=true"
            echo "output_sarif=true"
            echo
            echo "candidate_artifacts:"
            find "${GITHUB_WORKSPACE}" -maxdepth 4 \
              \( -name '*.sarif' -o -name '*crash*' -o -path '*/artifacts/*' \) \
              -print 2>/dev/null || true
          } > "${RUNNER_TEMP}/clusterfuzzlite-artifacts/manifest.txt"

      - name: Upload ClusterFuzzLite artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clusterfuzzlite-oss-fuzz-${{ matrix.sanitizer }}
          path: |
            ${{ runner.temp }}/clusterfuzzlite-artifacts
            ${{ github.workspace }}/artifacts
            ${{ github.workspace }}/crash-*
            ${{ github.workspace }}/*.sarif
          if-no-files-found: error

  # RESIL-003: required chaos/fault-injection gate. These tests deliberately break
  # the system's dependencies (signer death, NATS restart/partition, PostgreSQL
  # failover, store-write failure, restore interruption, memory pressure) and assert
  # the safe failure direction: retryable, replayable, or rolled back, never silent
  # success with corrupt derived state.
  chaos:
    name: chaos (fault injection)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # RESIL-003 (embedded PostgreSQL + race detector)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Fault-injection suite
        run: make chaos

  web:
    name: web ui (typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # TEST-004
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm audit scanner (pinned)
        run: npm install -g npm@${NPM_AUDIT_VERSION}

      # Go is needed for the embedded-UI release gate + the committed-bundle
      # freshness check below (the bundle the binary embeds is in this repo).
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install dependencies
        run: npm ci

      # Software-composition analysis of the npm dependency tree — it lives
      # outside go.sum, so it needs its own scan before redistribution. Fails the
      # build on a known high/critical advisory in the production tree.
      - name: SCA (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # FE↔BE contract gate (SURFACE-005): the generated FE types must match the
      # served OpenAPI contract. `npm run build` runs this too, but as an explicit,
      # legible CI step it points straight at the fix when it fails.
      - name: Contract check (FE types vs served OpenAPI)
        run: npm run gen:api -- --check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test (Vitest + axe accessibility + coverage)
        run: npm run test:coverage

      - name: Accessibility evidence receipt
        working-directory: .
        run: node scripts/accessibility/write-a11y-evidence-receipt.mjs --out "${RUNNER_TEMP}/accessibility-evidence-receipt.json"

      - name: Upload accessibility evidence receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-evidence-receipt
          path: ${{ runner.temp }}/accessibility-evidence-receipt.json
          if-no-files-found: error

      - name: First-run usability receipt
        working-directory: .
        run: |
          node scripts/usability/measure-first-run.mjs --out "${RUNNER_TEMP}/first-run-receipt.json"
          python3 scripts/usability/verify-release-evidence.py \
            --first-run "${RUNNER_TEMP}/first-run-receipt.json" \
            --release-notes-text "trstctl ci"

      - name: Upload first-run usability receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-run-usability-receipt
          path: ${{ runner.temp }}/first-run-receipt.json
          if-no-files-found: error

      - name: Build (Vite -> internal/webui/dist)
        run: npm run build

      # SURFACE-001/006 release gate: the freshly-built bundle the binary embeds must
      # be a REAL Vite build (a hashed module bundle), never the dead placeholder.
      - name: Embedded UI is a real build (release gate)
        working-directory: .
        env:
          TRSTCTL_REQUIRE_BUILT_UI: "1"
        run: go test ./internal/webui/...

      # The built bundle is committed (so a plain `go build` serves the real console).
      # Fail if the committed artifact drifts from a fresh build — i.e. someone changed
      # web/ but did not re-run `make web` and commit the regenerated bundle.
      - name: Committed web bundle is up to date
        working-directory: .
        run: |
          if ! git diff --exit-code -- internal/webui/dist web/src/lib/api-types.gen.ts; then
            echo "::error::internal/webui/dist (or the generated FE types) is stale. Run 'make web' and commit the regenerated bundle (EXC-WIRE-04 / SURFACE-001)." >&2
            exit 1
          fi

  docs:
    name: docs site (mkdocs build --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Pin to the 9.x line; MkDocs/Material 2.0 is a backward-incompatible rewrite.
      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.5,<10"

      # --strict fails the build on broken navigation or internal links, so the
      # published site is always consistent.
      - name: Build the docs site
        run: mkdocs build --strict

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # actionlint validates the workflow files themselves (for example, the
      # `secrets` context is not allowed in an `if:`), and runs shellcheck —
      # preinstalled on the runner — over every `run:` script.
      - name: Lint workflows
        run: actionlint -color

      # Every THIRD-PARTY action must be pinned by an immutable commit SHA, not a
      # mutable tag (SUPPLY-002). The self-test proves the guard catches a
      # floating-tag regression; the guard itself fails CI if any workflow drifts.
      - name: Verify third-party actions are SHA-pinned (not floating tags)
        run: |
          bash scripts/ci/check-actions-pinned_selftest.sh
          bash scripts/ci/check-actions-pinned.sh .

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Reachability-aware vulnerability scan: fails only on vulnerabilities the
      # code can actually reach (call-graph), not every advisory in the graph.
      # The version pin lives in exactly ONE place — GOVULNCHECK_VERSION in the
      # Makefile — and `make vuln` installs that pinned scanner and runs it over
      # ./... (by resolved path, not via PATH). A second literal @vX.Y.Z here is
      # how CI and a local run silently end up on different scanners, so CI must
      # not carry one; release.yml already runs the gate this same way.
      - name: Run govulncheck (pinned by Makefile GOVULNCHECK_VERSION)
        run: make vuln

      # D9: the OSS license audit runs beside the vulnerability scan, so
      # copyleft contamination of the distributed MPL-2.0 binaries is caught
      # by CI rather than by an acquirer's diligence. It now covers BOTH
      # dependency trees: the Go audit reads what is linked into the shipped
      # binaries, and the npm audit reads the console's runtime closure from
      # the lockfile. The web half also refuses source-available licenses
      # (BUSL/Elastic/Confluent/RSAL) — those do not contaminate, but they
      # restrict or tax selling the software, and can be relicensed under us
      # without warning.
      - name: Dependency license audit (shipped binaries + console tree)
        run: make license-audit

      - name: Upload license audit receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-audit
          path: |
            dist/release-evidence/license-audit.json
            dist/release-evidence/npm-license-audit.json
          if-no-files-found: error

  supply-chain:
    name: supply-chain (SBOM + binary SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install npm audit scanner (pinned)
        run: npm install -g npm@${NPM_AUDIT_VERSION}

      # npm dependency trees are outside go.sum. The SDK generator is a devDependency
      # used by scripts/gen-sdk.sh and the Pulumi IaC example resolves @pulumi/pulumi
      # at deploy time, so this audits web production deps, SDK generator deps, and
      # the Pulumi IaC tree, writes a severity-count receipt for release evidence,
      # then self-tests that a critical advisory in either non-web tree fails closed.
      - name: npm dependency tree SCA (web + TypeScript SDK + Pulumi IaC)
        env:
          TRSTCTL_NPM_AUDIT_EXPECTED_VERSION: ${{ env.NPM_AUDIT_VERSION }}
          TRSTCTL_NPM_AUDIT_RECEIPT: ${{ runner.temp }}/npm-audit-dependency-surfaces.json
        run: |
          bash scripts/ci/npm-audit-dependency-surfaces_selftest.sh
          bash scripts/ci/npm-audit-dependency-surfaces.sh

      - name: Upload npm audit severity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-dependency-surfaces
          path: ${{ runner.temp }}/npm-audit-dependency-surfaces.json
          if-no-files-found: error

      # A CycloneDX SBOM of the Go module graph, complementing the image SBOM the
      # release pipeline attaches. The generator is pinned for reproducibility.
      - name: Generate module SBOM (CycloneDX)
        run: make sbom

      - name: Upload module SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-module-cyclonedx
          path: dist/release-evidence/sbom.module.cyclonedx.json
          if-no-files-found: error

      # Dependency freshness is separate from SCA: govulncheck/npm audit answer
      # "is a known vulnerability reachable?", while this gate answers "is the
      # age budget and owner queue still current?" (CODE-005).
      - name: Dependency freshness SLO
        run: node scripts/ci/check-dependency-freshness.mjs

      # Verify and scan the embedded-postgres runtime binary (PostgreSQL pulled
      # from Maven Central — it lives outside go.sum): checksum-pin against the
      # committed provenance manifest (hard fail on any change), then Trivy-scan
      # the extracted binaries and write a machine-readable scanner receipt.
      - name: Verify & scan the embedded-postgres binary
        env:
          ARCH: linux-amd64
          TRSTCTL_EMBEDDED_PG_SCAN_DIR: ${{ runner.temp }}/embedded-postgres-scan
        run: bash scripts/supply-chain/verify-embedded-postgres.sh

      - name: Upload embedded-postgres Trivy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedded-postgres-trivy-receipt
          path: ${{ runner.temp }}/embedded-postgres-scan
          if-no-files-found: error

  embedded-postgres-scan:
    name: embedded-postgres scan (${{ matrix.embedded-postgres-arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30 # downloads Maven Central pins and runs Trivy per arch.
    strategy:
      fail-fast: false
      matrix:
        embedded-postgres-arch: [linux-amd64, linux-arm64v8, darwin-arm64v8]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install embedded-postgres verifier tools
        run: sudo apt-get update && sudo apt-get install -y curl jq unzip

      - name: Verify & scan the embedded-postgres binary
        env:
          ARCH: ${{ matrix.embedded-postgres-arch }}
          TRSTCTL_EMBEDDED_PG_SCAN_DIR: ${{ runner.temp }}/embedded-postgres-scan-${{ matrix.embedded-postgres-arch }}
        run: bash scripts/supply-chain/verify-embedded-postgres.sh

      - name: Upload embedded-postgres Trivy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedded-postgres-trivy-receipt-${{ matrix.embedded-postgres-arch }}
          path: ${{ runner.temp }}/embedded-postgres-scan-${{ matrix.embedded-postgres-arch }}
          if-no-files-found: error

  embedded-postgres-scan-receipts:
    name: embedded-postgres scan receipts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [embedded-postgres-scan]
    steps:
      - name: Confirm all embedded-postgres arch receipts were emitted
        run: echo "embedded-postgres arch-specific scan receipts are green"

  helm:
    name: helm (lint + render + schema)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4

      # Lint the control-plane chart with the required external-datastore values.
      - name: Helm lint
        run: |
          helm lint deploy/helm/trstctl \
            --set postgres.dsn='postgres://u:p@pg:5432/trstctl?sslmode=require' \
            --set nats.url='nats://nats:4222' --set kek.generate=true \
            --set signer.auth.tokenCommand=/usr/local/bin/trstctl-sign-approve

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Schema-validate the rendered manifests against the Kubernetes API schemas.
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Render + schema-validate the chart
        run: |
          helm template trstctl deploy/helm/trstctl --namespace trstctl \
            --set postgres.dsn='postgres://u:p@pg:5432/trstctl?sslmode=require' \
            --set nats.url='nats://nats:4222' --set kek.generate=true \
            --set signer.auth.tokenCommand=/usr/local/bin/trstctl-sign-approve \
            | kubeconform -strict -summary -ignore-missing-schemas

  proto:
    name: proto (buf lint + breaking-change gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # TEST-004
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so `buf breaking --against '.git#branch=main'` can resolve
          # the baseline contract to diff against.
          fetch-depth: 0

      - name: Install buf (pinned)
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.47.2
          setup_only: true

      # Lint the signer proto and fail the build on a wire-incompatible change to the
      # control-plane↔signer gRPC contract (AN-4): a removed/renumbered field, a
      # changed type, a removed RPC/message/enum. Additive changes pass.
      - name: buf lint
        run: buf lint

      - name: buf breaking (against main)
        run: buf breaking --against '.git#branch=main'

      # SCHEMA-004: regenerate the committed signer protobuf/gRPC Go and fail on any
      # drift. `make generate` (raw protoc) and `buf breaking` exist, but nothing
      # proved the committed internal/signing/proto/*.pb.go actually match the .proto:
      # a hand-edited or stale generated file would compile and pass the breaking gate
      # while diverging from the contract. `buf generate` uses buf.gen.yaml's pinned
      # remote plugins (buf.build/protocolbuffers/go + buf.build/grpc/go) — the same
      # paths=source_relative output the Makefile's protoc target produces — so this
      # needs no separately-installed protoc/protoc-gen-go/protoc-gen-go-grpc and
      # stays reproducible against the buf version pinned above.
      #
      # We generate into a scratch dir and diff against the committed files with two
      # kinds of legitimate, non-semantic noise normalized away, so the gate flags real
      # contract/shape drift and never flaps on tooling cosmetics:
      #   * the `// versions:` block (protoc / plugin version stamps move with the
      #     pinned toolchain, not with the wire contract); and
      #   * signer_grpc.pb.go's curated design-header comment (lines above the
      #     "Code generated by" marker) that the repo keeps by hand on top of the
      #     generated output and that the generator does not reproduce.
      - name: buf generate (regenerate signer protobuf into scratch dir)
        run: |
          rm -rf "${RUNNER_TEMP}/proto-regen"
          buf generate --output "${RUNNER_TEMP}/proto-regen"

      - name: Verify committed signer *.pb.go match regeneration (no drift)
        run: |
          set -euo pipefail
          regen="${RUNNER_TEMP}/proto-regen/internal/signing/proto"
          # normalize() drops the version stamp block and every generated/curated
          # header comment, then squeezes blank lines, leaving only the semantic body.
          normalize() {
            sed -E \
              -e '/^\/\/[[:space:]]*versions:/d' \
              -e '/^\/\/[[:space:]]*-?[[:space:]]*protoc(-gen-go(-grpc)?)?[[:space:]]+v[0-9]/d' \
              -e '/^\/\/[[:space:]]*-?[[:space:]]*protoc[[:space:]]+v[0-9]/d' \
              -e '/^\/\//d' \
              "$1" | sed -E '/^[[:space:]]*$/d'
          }
          fail=0
          for f in signer.pb.go signer_grpc.pb.go; do
            if [ ! -f "${regen}/${f}" ]; then
              echo "::error::buf generate did not produce ${f}; check buf.gen.yaml (SCHEMA-004)"; fail=1; continue
            fi
            if ! diff -u <(normalize "internal/signing/proto/${f}") <(normalize "${regen}/${f}"); then
              echo "::error::Committed internal/signing/proto/${f} is out of date with signer.proto. Run 'make generate' (or 'buf generate') and commit the regenerated file (SCHEMA-004)."
              fail=1
            fi
          done
          exit "${fail}"

      - name: Agent JSON contract gate
        run: go test ./internal/agent/transport ./internal/protocol -count=1

  acme-conformance:
    name: acme conformance (Pebble differential)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # TEST-004 (spins up the Pebble service)
    services:
      # Pebble is the reference test ACME CA. The same RFC 8555 protocol-
      # conformance routine that runs against trstctl in the unit suite runs here
      # against Pebble — a divergence in trstctl's protocol surface from the
      # reference surfaces as a test failure.
      pebble:
        # ghcr.io/letsencrypt/pebble:2.10.1 — the reference test ACME CA, pinned by
        # digest. GHCR publishes un-prefixed tags and never carried v2.6.0; 2.10.1 is
        # the current published release.
        image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
        env:
          PEBBLE_VA_NOSLEEP: "1"
        ports:
          - 14000:14000
          - 15000:15000
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Pebble serves its ACME directory over HTTPS with a fixed test CA
      # (pebble.minica.pem, baked into the pinned image); trust it so the default
      # client can reach the directory. No crypto/tls in the test itself (AN-3) —
      # SSL_CERT_FILE makes Go's standard pool trust Pebble's CA.
      - name: Trust Pebble's test CA
        run: curl -fsSL "https://raw.githubusercontent.com/letsencrypt/pebble/v2.10.1/test/certs/pebble.minica.pem" -o "${RUNNER_TEMP}/pebble-ca.pem"

      - name: Wait for Pebble to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsk https://localhost:14000/dir >/dev/null 2>&1; then echo "pebble ready"; exit 0; fi
            sleep 1
          done
          echo "::error::Pebble did not become ready"; exit 1

      - name: ACME protocol differential vs Pebble
        env:
          PEBBLE_DIRECTORY_URL: https://localhost:14000/dir
          SSL_CERT_FILE: ${{ runner.temp }}/pebble-ca.pem
        run: go test ./internal/protocols/acme/ -run TestACMEProtocolDifferentialVsPebble -count=1 -v

  acme-stock-client-conformance:
    name: acme stock-client conformance (certbot transcript)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # INTEROP-004 (stock certbot issue/renew/revoke transcript)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned certbot client
        run: |
          python3 -m venv "${RUNNER_TEMP}/certbot-venv"
          "${RUNNER_TEMP}/certbot-venv/bin/python" -m pip install 'certbot==5.6.0'
          echo "${RUNNER_TEMP}/certbot-venv/bin" >> "${GITHUB_PATH}"

      - name: certbot issue renew revoke against served ACME endpoint
        env:
          TRSTCTL_REQUIRE_CERTBOT: "1"
          TRSTCTL_INTEROP_TRANSCRIPT_DIR: ${{ runner.temp }}/interop-transcripts
        run: |
