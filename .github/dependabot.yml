version: 2
# Every dependency surface keeps an entry here, so the dependency graph and its
# Dependabot alerts cover it (SF.1, beside the govulncheck gate in ci.yml), but
# version-update PRs are off: `open-pull-requests-limit: 0` on every ecosystem is
# how GitHub disables them (owner decision 2026-11-02: no PRs or branches; every
# upgrade lands as a reviewed commit on main).
updates:
  # Go modules (control plane, signer, agent, linter).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(go)"

  # GitHub Actions used by the workflows. Every third-party action is pinned by a
  # 40-hex commit SHA (SUPPLY-002, enforced by scripts/ci/check-actions-pinned.sh);
  # A pin bump lands as a commit on main that updates the SHA and its `# vX.Y.Z`
  # comment together, so a pin never reverts to a mutable tag.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(actions)"

  # Web UI npm dependencies.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"

  # TypeScript SDK generator/runtime npm dependencies.
  - package-ecosystem: npm
    directory: "/clients/sdk/typescript"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      sdk-typescript-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(sdk-ts)"

  # Pulumi IaC example npm dependencies. The example's Node runtime resolves
  # @pulumi/pulumi at deploy time, so it is a real dependency surface even though
  # it ships as a copyable example; scripts/ci/npm-audit-dependency-surfaces.sh
  # audits its lockfile and SUPPLY-106 requires this entry to exist.
  - package-ecosystem: npm
    directory: "/deploy/iac/pulumi/trstctl-resources"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      pulumi-iac-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(pulumi-iac)"

  # Container base images in the Dockerfile.
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(docker)"

  # Container images in the live-demo stack (docker-compose.yml + Dockerfile.seed).
  # Every image there is digest-pinned (SUPPLY-008, enforced by
  # scripts/ci/check-compose-images-pinned.sh); a digest bump lands as a commit on
  # main, so a pin never reverts to a mutable tag.
  # The demo stack had no docker updater at all, and its non-Postgres/NATS images
  # were authored with floating tags rather than pins; this entry keeps them in
  # the dependency graph.
  - package-ecosystem: docker
    directory: "/deploy/demo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(docker)"
