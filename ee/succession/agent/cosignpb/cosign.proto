// Workload-agent predecessor co-sign contract (PCAS claim 19, INT-16). The platform
// signer/orchestrator forms a succession commitment and asks the workload agent —
// which holds the predecessor key — to co-sign it. The request carries the STRUCTURED
// commitment fields (a canonical, reversible encoding), NEVER an opaque digest, so the
// agent reconstructs and domain-separates the commitment itself and can never be used
// as a generic signing oracle (FIG. 5 oracle-prevention). Only the predecessor
// signature — public material — crosses back.
syntax = "proto3";

package trstctl.pcas.agent.v1;

option go_package = "trstctl.com/trstctl/ee/succession/agent/cosignpb";

// CoSignerService is served by the workload agent. It is deliberately minimal: a
// single co-sign method under a distinct key-usage purpose.
service CoSignerService {
  // CoSign returns the predecessor co-signature over the commitment the agent
  // reconstructs from the structured fields. The agent refuses any request outside
  // its co-sign purpose, or whose identity/tenant/deployment/predecessor-key is not
  // its own.
  rpc CoSign(CoSignRequest) returns (CoSignResponse);
}

message CoSignRequest {
  // purpose is the distinct key-usage purpose; a request under any other purpose is
  // refused so the agent cannot be repurposed as a generic signing oracle.
  string purpose = 1;
  // fields is the canonical, reversible encoding of the succession commitment fields
  // (agent.MarshalFields). It is NOT a digest: the agent decodes it into typed,
  // inspectable fields, validates them against its own binding, and reconstructs the
  // domain-separated commitment itself before signing.
  bytes fields = 2;
}

message CoSignResponse {
  // signature is the predecessor co-signature over the agent-reconstructed
  // commitment. Only this public material crosses back; the predecessor key never
  // leaves the agent.
  bytes signature = 1;
}
