// Protocol stub for the isolated signing service (AN-4). This is the wire
// contract the control plane uses to reach trstctl-signer over a Unix domain
// socket (single node) or mTLS (across nodes). It is committed as the reviewed
// protocol design for sprint S1.3; Go code is generated and the service is
// implemented in S1.4.
//
// Design rationale, threat model, and the dependency budget live in
// docs/design/signing-service.md.
syntax = "proto3";

package trstctl.signing.v1;

option go_package = "trstctl.com/trstctl/internal/signing/proto;signerpb";

// SignerService performs all private-key operations inside the sacred signer
// process. Private key material never crosses this boundary: callers receive
// opaque key handles and public keys only.
//
// The service has no HTTP surface and no database access; it speaks only this
// gRPC contract over UDS/mTLS (AN-4).
service SignerService {
  // GenerateKey creates a new private key inside the signer and returns its
  // handle and public key. The private key never leaves the process.
  rpc GenerateKey(GenerateKeyRequest) returns (GenerateKeyResponse);

  // GetPublicKey returns the public key for an existing handle.
  rpc GetPublicKey(GetPublicKeyRequest) returns (GetPublicKeyResponse);

  // Sign produces a signature over a message using the keyed handle.
  rpc Sign(SignRequest) returns (SignResponse);

  // DestroyKey zeroizes and forgets a key handle. It is idempotent.
  rpc DestroyKey(DestroyKeyRequest) returns (DestroyKeyResponse);

  // Health reports liveness and readiness. It returns no secret material.
  rpc Health(HealthRequest) returns (HealthResponse);

  // MintSuccessor mints a dual-signed PCAS succession record inside the signer
  // (INT-01). No private key crosses the boundary: the predecessor is referenced
  // by an opaque handle held in the signer, the successor key is generated inside
  // the signer, and only the successor public key and the opaque encoded record
  // are returned. A succession minter must be attached (WithSuccessionMinter) or
  // the signer fails closed with UNIMPLEMENTED. This is the wire path by which the
  // control plane requests a succession without ever obtaining private key
  // material (claims 1/12/49): the control plane can request, but cannot forge.
  rpc MintSuccessor(MintSuccessorRequest) returns (MintSuccessorResponse);

  // GenerateSuccessorKEM creates a KEM private key inside the signer and returns
  // only the encapsulation public key. The KEM private key is not a signing key:
  // it is held in a signer-side KEM custody store and can be used only through the
  // KEM-specific RPCs below.
  rpc GenerateSuccessorKEM(GenerateSuccessorKEMRequest) returns (GenerateSuccessorKEMResponse);

  // Decapsulate derives a shared secret from a signer-held KEM private key and a
  // ciphertext. The private key never leaves the signer. The returned shared
  // secret is byte-native secret material for immediate re-wrap use and callers
  // must wipe it after use.
  rpc Decapsulate(DecapsulateRequest) returns (DecapsulateResponse);

  // ZeroizeKey removes a key from signer custody. It applies to KEM custody first
  // and then falls through to signing-key custody, so retirement can destroy either
  // class through one PCAS RPC.
  rpc ZeroizeKey(ZeroizeKeyRequest) returns (ZeroizeKeyResponse);

  // GatedIssue drives a gated agent-credential issuance INSIDE the signer over the
  // transport (AGID-INT-WIRE core). It mirrors MintSuccessor: the request carries only
  // the opaque issuance preconditions (a self-describing delegation chain / attestation /
  // agent-stack representation as opaque bytes) and non-secret scalars; the isolated
  // signer runs the attached issuance gate (WithIssuanceGate) which verifies the chain +
  // attestation BEFORE any key op (INV-A1), then, on approval, the attached issuance
  // key-op generates the agent key INSIDE the signer and certifies it under the
  // signer-held issuing CA. Only PUBLIC material crosses back: the issued credential's
  // public key + the opaque encoded issuance/refusal record. No private key ever leaves
  // the boundary. An issuance key-op must be attached (WithIssuanceKeyOp) or the signer
  // fails closed with UNIMPLEMENTED. This is the wire path by which the control plane
  // requests a chain-bound issuance without ever obtaining private key material: it can
  // request, but cannot forge.
  rpc GatedIssue(GatedIssueRequest) returns (GatedIssueResponse);
}

// Algorithm mirrors internal/crypto.Algorithm. Proprietary algorithms use
// neutral licensed slots; the EE attach seam owns their concrete names.
enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;
  ALGORITHM_RSA_2048 = 1;
  ALGORITHM_RSA_3072 = 2;
  ALGORITHM_RSA_4096 = 3;
  ALGORITHM_ECDSA_P256 = 4;
  ALGORITHM_ECDSA_P384 = 5;
  ALGORITHM_ECDSA_P521 = 6;
  ALGORITHM_LICENSED_1 = 7;
  ALGORITHM_LICENSED_2 = 8;
  ALGORITHM_LICENSED_3 = 9;
  ALGORITHM_LICENSED_4 = 10;
  ALGORITHM_LICENSED_5 = 11;
  ALGORITHM_LICENSED_6 = 12;
  ALGORITHM_LICENSED_7 = 13;
}

// Hash mirrors internal/crypto.Hash.
enum Hash {
  HASH_UNSPECIFIED = 0;
  HASH_SHA256 = 1;
  HASH_SHA384 = 2;
  HASH_SHA512 = 3;
}

// RSAPadding mirrors internal/crypto.RSAPadding; ignored for non-RSA keys.
enum RSAPadding {
  RSA_PADDING_UNSPECIFIED = 0; // treated as PKCS#1 v1.5
  RSA_PADDING_PKCS1V15 = 1;
  RSA_PADDING_PSS = 2;
}

// KeyPurpose is a coarse, signer-enforceable usage class for a key (design
// §4.5). A key may be created with an allowed-purpose set; Sign then carries the
// purpose the caller asserts the signature is for, and the signer refuses any
// Sign whose purpose is outside the key's set (FAILED_PRECONDITION). This is the
// one cheap defense-in-depth the signer can enforce against an abused control
// plane: a key minted for, say, leaf TLS cannot be coerced into signing a CA
// cross-sign or an SSH/code-signing certificate. It bounds, but does not
// eliminate, key abuse (which is fully addressed only by HSMs/dual control).
enum KeyPurpose {
  KEY_PURPOSE_UNSPECIFIED = 0; // no purpose asserted; rejected by a constrained key
  KEY_PURPOSE_CA_SIGN = 1;     // sign CA/intermediate/leaf X.509 certificates
  KEY_PURPOSE_LEAF_TLS = 2;    // sign leaf TLS certificates only
  KEY_PURPOSE_SSH_CERT = 3;    // sign SSH certificates
  KEY_PURPOSE_CODE_SIGN = 4;   // produce code-signing signatures
  KEY_PURPOSE_GENERIC = 5;     // unclassified signing (e.g. test/CSR self-sign)
}

// KeyHandle is an opaque, unguessable reference to a private key held by the
// signer. The control plane stores the handle and the public key; it never sees
// the private key bytes.
message KeyHandle {
  string id = 1;
}

message GenerateKeyRequest {
  Algorithm algorithm = 1;
  // Optional caller-chosen handle id for idempotent creation; empty means the
  // signer assigns one.
  string requested_id = 2;
  // allowed_purposes constrains what the key may sign (design §4.5). When
  // non-empty, the signer refuses any Sign whose asserted purpose is not in this
  // set. An empty set means unconstrained (back-compat with pre-constraint
  // callers); the control plane sets a tight set for CA-class keys.
  repeated KeyPurpose allowed_purposes = 3;
  // allowed_hashes optionally constrains which digest algorithms the key may
  // sign. When non-empty, a Sign with a hash outside the set is refused. Empty
  // means any supported hash is allowed.
  repeated Hash allowed_hashes = 4;
}

message GenerateKeyResponse {
  KeyHandle handle = 1;
  Algorithm algorithm = 2;
  // public_key is the PKIX/DER (SubjectPublicKeyInfo) encoding.
  bytes public_key = 3;
}

message GetPublicKeyRequest {
  KeyHandle handle = 1;
}

message GetPublicKeyResponse {
  Algorithm algorithm = 1;
  bytes public_key = 2;
}

message SignRequest {
  KeyHandle handle = 1;
  // digest is the pre-computed message digest to sign. Signing a digest (rather
  // than a raw message) is the canonical signer operation: it matches
  // crypto.Signer/HSM semantics and is what X.509 CSR and certificate signing
  // require.
  bytes digest = 2;
  // hash identifies the algorithm that produced digest (needed for RSA).
  Hash hash = 3;
  RSAPadding rsa_padding = 4;
  // purpose is the usage class the caller asserts this signature is for. If the
  // key was created with a non-empty allowed_purposes set, the signer enforces
  // purpose membership and refuses a mismatch with FAILED_PRECONDITION (design
  // §4.5/§5.5). For an unconstrained key it is advisory and may be left
  // UNSPECIFIED.
  KeyPurpose purpose = 5;
  // authorization_token is the raw dual-control authorization token for this exact
  // signing tuple. It stays byte-native across the gRPC boundary so callers and the
  // signer can wipe their owned buffers after use.
  bytes authorization_token = 6;
}

message SignResponse {
  bytes signature = 1;
}

message DestroyKeyRequest {
  KeyHandle handle = 1;
}

message DestroyKeyResponse {}

message HealthRequest {}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SERVING = 1;
    STATUS_NOT_SERVING = 2;
    STATUS_DRAINING = 3;
  }
  Status status = 1;
}

// MintSuccessorRequest mirrors internal/signing.MintRequest (INT-01). It carries
// NO private key material: the predecessor is a handle held inside the signer, and
// every authorization/policy/attestation input is opaque bytes verified in-signer
// before any successor key is generated.
message MintSuccessorRequest {
  string identity_id = 1;
  string tenant_id = 2;
  string deployment_scope = 3;
  // predecessor_handle is the opaque in-signer handle of the predecessor key. The
  // control plane never sees the predecessor private key bytes.
  string predecessor_handle = 4;
  uint64 asserted_predecessor_epoch = 5;
  Algorithm target_algorithm = 6;
  string policy_ref = 7;
  bytes policy_decision = 8; // signed policy artifact (optional)
  bytes authorization = 9;   // dual-control authorization token (optional)
  bytes break_glass = 10;    // strength-downgrade break-glass token (optional)
  bytes attestation = 11;    // successor-custodian attestation evidence (optional)
  int64 not_before = 12;
  int64 not_after = 13;
  string delegation_scope = 14; // delegated-authority scope id bound into the PCAS commitment
}

// MintSuccessorResponse mirrors internal/signing.MintResult (INT-01). It carries
// only public material: the successor public key and the opaque encoded dual-signed
// succession record. No private key crosses the boundary.
message MintSuccessorResponse {
  uint64 epoch = 1;
  Algorithm successor_algorithm = 2;
  bytes successor_public_key = 3; // PKIX/DER (SubjectPublicKeyInfo)
  bytes encoded_record = 4;       // opaque dual-signed succession record
}

message GenerateSuccessorKEMRequest {
  string handle = 1;
  Algorithm algorithm = 2;
}

message GenerateSuccessorKEMResponse {
  string handle = 1;
  Algorithm algorithm = 2;
  bytes public_key = 3;
}

message DecapsulateRequest {
  string handle = 1;
  bytes ciphertext = 2;
}

message DecapsulateResponse {
  bytes shared_secret = 1;
}

message ZeroizeKeyRequest {
  string handle = 1;
}

message ZeroizeKeyResponse {}

// GatedIssueRequest mirrors internal/signing.IssuancePreconditions (AGID-04a seam). It
// carries NO private key material: the delegation chain, attestation evidence, and
// agent-stack representation are opaque bytes the isolated signer's attached issuance gate
// re-verifies cryptographically before any key op, and the scalars are non-secret asserted
// context. The signer never parses the opaque bodies; it forwards them to the gate, whose
// meaning the attached edition defines.
message GatedIssueRequest {
  // tenant_id scopes the request to a tenant (AN-1).
  string tenant_id = 1;
  // trust_anchor_ref is the asserted trust-anchor reference the caller claims this
  // issuance derives from (an opaque subject handle). The gate resolves and checks it.
  string trust_anchor_ref = 2;
  // not_before / not_after are the asserted validity bounds (Unix seconds) for the
  // credential to be issued. The gate decides whether they are acceptable.
  int64 not_before = 3;
  int64 not_after = 4;
  // preconditions is the opaque precondition body (the serialized delegation chain +
  // designated class + task envelope + reachability verdict). Opaque to the signer core.
  bytes preconditions = 5;
  // subject_repr is the opaque agent-stack representation to bind into the issued
  // credential. Opaque to the signer core.
  bytes subject_repr = 6;
  // attestation is the opaque attestation evidence accompanying the request;
  // attestation_method names the method that produced it. Both opaque to the signer core.
  bytes attestation = 7;
  string attestation_method = 8;
  // algorithm is the agent-credential key algorithm to generate INSIDE the signer on an
  // approved issuance (the key never leaves the boundary; only its certified public form
  // returns). Unspecified means the issuance key-op picks its default.
  Algorithm algorithm = 9;
}

// GatedIssueResponse mirrors internal/signing.IssuanceDecision. It carries ONLY non-secret
// material: whether the issuance was approved, the opaque signed refusal record on a
// refusal, and — on approval — the opaque binding material, the issued credential's public
// DER, and the opaque encoded issuance record. No private key crosses the boundary.
message GatedIssueResponse {
  // approved is true only when the gate approved and the key op minted a credential. When
  // false, refusal_record carries the signer's signed refusal and no key op was performed.
  bool approved = 1;
  // refusal_record is the opaque signed refusal artifact the gate produced on a refusal
  // (Approved=false). Empty on an approval.
  bytes refusal_record = 2;
  // binding_material is the opaque binding the gate bound into the credential (for example
  // the chain-digest + agent-stack commitment). Empty on a refusal.
  bytes binding_material = 3;
  // credential_public_der is the DER (PKIX SubjectPublicKeyInfo) of the issued credential
  // — the certified agent credential's public form. Public material only; empty on refusal.
  bytes credential_public_der = 4;
  // encoded_record is the opaque encoded issuance record the key op produced (for example
  // the issued certificate DER carrying the binding extension). Empty on a refusal.
  bytes encoded_record = 5;
}
