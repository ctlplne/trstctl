site_name: trstctl
site_description: Self-hosted control plane for every non-human identity.
docs_dir: docs
site_dir: .site

theme:
  name: material
  logo: assets/trstctl-mark.svg
  favicon: assets/trstctl-mark.svg
  # Keep the rendered docs usable in an air-gapped evaluation and avoid leaking
  # every reader's IP/user-agent to Google merely by opening a local page.
  # Material otherwise injects Google's remote font endpoints at runtime.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/quiet-confidence.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

