# gitleaks configuration for trstctl (SF.1 — secret scanning gate).
#
# Start from gitleaks' maintained default ruleset (AWS keys, private keys,
# generic high-entropy assignments, provider tokens, etc.) so new rules are
# picked up automatically, then add a DELIBERATELY NARROW allowlist for the
# project's deterministic test vectors.
#
# Scope of the allowlists, and why they do not hide credentials (02-GUARDRAILS):
#   - There is no whole-file or test-source exemption. A GitHub PAT, Slack bot
#     token, or private key committed into a `_test.go` file fails the scan.
#   - The global allowlist pins the exact published connector conformance key
#     body. Other historical test vectors are pinned in .gitleaksignore by
#     commit/path/rule/line fingerprint.
#   - The rule-specific allowance below requires BOTH a generated Journeys
#     chunk path AND a static `bodyKey:"journeys.*"` lookup match. Another
#     generic API key in that same chunk still fails. Gitleaks v8.27.2 ignores
#     `targetRules` in global allowlists, and a global path allowlist suppresses
#     every rule for that file. The `[[rules]]` extension preserves the default
#     generic rule (the all-path selector is neutral) and attaches its own
#     AND-scoped allowlist instead.
#   - internal/secretscan tests check the exact config shape and run the pinned
#     scanner over planted credentials in test source and a generated chunk.
[extend]
useDefault = true

[allowlist]
description = "The published connector conformance keypair (a deterministic vector, not a live secret)."
# The one published conformance keypair that lives in non-_test source
# (internal/connector/conformance.go) — a deterministic ECDSA P-256 vector
# (CN conformance.connector.test) shipped so forks/plugins can self-validate the
# connector suite (the conformance-oracle carve-out). Pinned by its EXACT key body so a future real
# finding in that file is NOT suppressed. The full-history scan also sees this
# fixture's earlier placeholder form; .gitleaksignore pins that one historical
# finding by exact fingerprint instead of broadening this rule.
regexTarget = "match"
regexes = [
  '''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg2drNvkGQeqFUx3xE''',
]

[[rules]]
id = "generic-api-key"
# The default rule has no path restriction. This equivalent all-path selector
# lets the extension attach an allowlist without replacing its regex or entropy.
path = '''.*'''

[[rules.allowlists]]
description = "Static journey bodyKey lookups in generated console chunks only"
condition = "AND"
paths = ['''(^|/)internal/webui/dist/assets/Journeys-[A-Za-z0-9_-]+\.js$''']
regexTarget = "match"
regexes = ['''^bodyKey:["`]journeys\.[A-Za-z0-9_.-]+["`]$''']
