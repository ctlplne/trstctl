# gitleaks configuration for trstctl (SF.1 — secret scanning gate).
#
# Start from gitleaks' maintained default ruleset (AWS keys, private keys,
# generic high-entropy assignments, provider tokens, etc.) so new rules are
# picked up automatically, then add a DELIBERATELY NARROW allowlist for the
# project's deterministic test vectors.
#
# Scope of the allowlist, and why it does not "hide leaks" (02-GUARDRAILS):
#   - There is NO path-based exemption. Every tracked file is scanned by every
#     rule, `_test.go` sources and `testdata/` fixtures included: a GitHub PAT,
#     a Slack bot token, or a private key committed into a `_test.go` file fails
#     the scan exactly like one committed into production source.
#   - The single allowlist below is an exact-secret-body regex for the one
#     published connector conformance keypair. Every other known false positive
#     - deterministic PEM vectors in test sources, redactor-corpus sample
#     tokens, code identifiers, translation keys, documentation examples - is
#     pinned individually in .gitleaksignore by exact commit/path/rule/line
#     fingerprint, so a NEW match at any other location still fails the scan.
#   - Measured against the pinned gitleaks v8.27.2 binary: rule scoping is
#     unavailable. Adding `targetRules` to either the singular `[allowlist]`
#     table or a plural `[[allowlists]]` table silently disables that whole
#     allowlist block rather than narrowing it, so per-fingerprint pinning is
#     the narrowest suppression this tool version actually honors.
#   - Guarded by two tests in internal/secretscan: this file's SHAPE (no
#     `paths`, no `targetRules`, conformance-key body still pinned) by
#     TestGitleaksConfigHasNoPathBasedTestSourceExemption, and the BEHAVIOR
#     (a token and a PEM planted in a `*_test.go` file are reported by a scan
#     running under this very config, while the conformance vector is not) by
#     TestServedGitleaksScanDetectsPlantedSecretInTestSource.
[extend]
useDefault = true

[allowlist]
description = "The published connector conformance keypair (a deterministic vector, not a live secret)."
# The one published conformance keypair that lives in non-_test source
# (internal/connector/conformance.go) — a deterministic ECDSA P-256 vector
# (CN conformance.connector.test) shipped so forks/plugins can self-validate the
# connector suite (the conformance-oracle carve-out). Pinned by its EXACT key body so a future real
# finding in that file is NOT suppressed. The full-history scan also sees this
# fixture's earlier placeholder form; .gitleaksignore pins that one historical
# finding by exact fingerprint instead of broadening this rule.
regexTarget = "match"
regexes = [
  '''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg2drNvkGQeqFUx3xE''',
]
