# Enable only after configuring the scope macro, role/index ACLs and HEC input.
[trstctl - Repeated renewal failures]
description = Three distinct renewal failure events for one identity in 15 minutes. Retries of an audit-feed batch do not increase the count. This is an operator triage signal, not proof of compromise or failed recovery.
search = `trstctl_scope` sourcetype="trstctl:audit" type="identity.renewal_failed" | spath path=data.identity_id output=identity_id | search id=* tenant_id=* identity_id=* | dedup tenant_id id | stats count AS event_count values(id) AS event_ids BY tenant_id identity_id | where event_count>=3
disabled = true
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_condition = search event_count>=3
alert.track = true
alert.digest_mode = true
actions =

[trstctl - Certificate revocation burst]
description = Five distinct certificate revocation events for one tenant in 15 minutes. Planned bulk revocation can trigger this signal. It does not prove CRL/OCSP enforcement or workload containment.
search = `trstctl_scope` sourcetype="trstctl:audit" type="certificate.revoked" | search id=* tenant_id=* | dedup tenant_id id | stats count AS event_count values(id) AS event_ids BY tenant_id | where event_count>=5
disabled = true
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_condition = search event_count>=5
alert.track = true
alert.digest_mode = true
actions =
