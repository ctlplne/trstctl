            - mountPath: /data
              name: cp-data
            - mountPath: /etc/trstctl/kms-wrap
              name: kms-wrap
              readOnly: true
            - mountPath: /etc/trstctl/signer-auth
              name: signer-auth
              readOnly: true
            - mountPath: /opt/vendor/pkcs11
              name: hsm-client
              readOnly: true
