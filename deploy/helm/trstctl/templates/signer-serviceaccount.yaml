{{- if eq .Values.signer.mode "isolated" }}
{{- with .Values.signer.serviceAccount }}
{{- if .create }}
# A200-L1: the isolated signer's own service account, so a cloud identity
# (IRSA's role annotation, an EKS Pod Identity association) reaches the signer
# and not the control plane. The signer talks to no Kubernetes API: the
# account's token is not mounted and it is granted no RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trstctl.signerServiceAccountName" $ }}
  labels:
    {{- include "trstctl.signerLabels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
