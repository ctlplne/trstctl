apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trstctlcontrolplanes.trstctl.com
spec:
  group: trstctl.com
  scope: Namespaced
  names:
    kind: TrstctlControlPlane
    plural: trstctlcontrolplanes
    singular: trstctlcontrolplane
    shortNames: ["tcp"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                image:
                  type: string
                signerMode:
                  type: string
                  enum: ["sidecar", "isolated"]
                signer:
                  type: object
                  properties:
                    authSecret:
                      type: string
                    authSecretKey:
                      type: string
                    kekSecret:
                      type: string
                    kekSecretKey:
                      type: string
                    keyStorePVC:
                      type: string
                    authTokenCommand:
                      type: string
                      description: >-
                        The independent command the control plane runs for each
                        signer authorization token. Required with production NATS
                        (nats.url set, nats.allowSingleReplica false).
                    allowCoResidentAuthorizer:
                      type: boolean
                      description: >-
                        Evaluation only, sidecar signer only: the control plane
                        mounts the signer's verifier secret and mints its own tokens.
                    mtls:
                      type: object
                      description: >-
                        The isolated signer's mutually pinned channel. Each Secret holds
                        tls.crt, tls.key, peer-ca.pem and peer-pin. Name neither Secret
                        and the operator generates the pair into <name>-signer-mtls and
                        <name>-cp-signer-mtls and renews it before it expires. serverName
                        defaults to the signer Service's in-cluster DNS name.
                      properties:
                        signerSecret:
                          type: string
                        controlPlaneSecret:
                          type: string
                        serverName:
                          type: string
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: ["ClusterIP", "NodePort", "LoadBalancer"]
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                ingress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    className:
                      type: string
                    host:
                      type: string
                    tlsSecret:
                      type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                networkPolicy:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    ingressController:
                      type: object
                      properties:
                        disabled:
                          type: boolean
                        namespaceLabels:
                          type: object
                          additionalProperties:
                            type: string
                        podLabels:
                          type: object
                          additionalProperties:
                            type: string
                    allowSameNamespace:
                      type: boolean
                    allowedNamespaces:
                      type: array
                      items:
                        type: string
                    egressCIDRs:
                      type: array
                      items:
                        type: string
                    postgresPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    natsPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                postgres:
                  type: object
                  properties:
                    dsnSecret:
                      type: string
                    dsnSecretKey:
                      type: string
                nats:
                  type: object
                  properties:
                    url:
                      type: string
                    replicas:
                      type: integer
                      minimum: 1
                    allowSingleReplica:
                      type: boolean
                    syncAlways:
                      type: boolean
                    syncIntervalSeconds:
                      type: integer
                      minimum: 1
                externalKMS:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    provider:
                      type: string
                    keyRef:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                readySurfaces:
                  type: integer
                surfaces:
                  type: object
                  additionalProperties:
                    type: string
                message:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trstctlsecretsyncs.trstctl.com
spec:
  group: trstctl.com
  scope: Namespaced
  names:
    kind: TrstctlSecretSync
    plural: trstctlsecretsyncs
    singular: trstctlsecretsync
    shortNames: ["tss"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["controlPlane", "target", "data"]
              properties:
                controlPlane:
                  type: object
                  required: ["url", "tokenSecretRef"]
                  properties:
                    url:
                      type: string
                    tenantID:
                      type: string
                    tokenSecretRef:
                      type: object
                      required: ["name"]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                target:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                      default: Opaque
                data:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: ["key", "remoteRef"]
                    properties:
                      key:
                        type: string
                      remoteRef:
                        type: object
                        required: ["name"]
                        properties:
                          name:
                            type: string
                reload:
                  type: object
                  properties:
                    workloads:
                      type: array
                      items:
                        type: object
                        required: ["kind", "name"]
                        properties:
                          kind:
                            type: string
                            enum: ["Deployment", "StatefulSet", "DaemonSet"]
                          name:
                            type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                targetSecret:
                  type: string
                syncedKeys:
                  type: integer
                contentHash:
                  type: string
                reloadedWorkloads:
                  type: array
                  items:
                    type: string
                message:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trstctlsecretinjections.trstctl.com
spec:
  group: trstctl.com
  scope: Namespaced
  names:
    kind: TrstctlSecretInjection
    plural: trstctlsecretinjections
    singular: trstctlsecretinjection
    shortNames: ["tsi"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["sourceSecretName", "workloads", "items"]
              properties:
                sourceSecretName:
                  type: string
                workloads:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: ["kind", "name"]
                    properties:
                      kind:
                        type: string
                        enum: ["Deployment", "StatefulSet", "DaemonSet"]
                      name:
                        type: string
                      containers:
                        type: array
                        items:
                          type: string
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: ["key"]
                    properties:
                      key:
                        type: string
                      path:
                        type: string
                      env:
                        type: string
                mountPath:
                  type: string
                  default: /trstctl/secrets
                agentImage:
                  type: string
                refreshIntervalSeconds:
                  type: integer
                  minimum: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                sourceSecret:
                  type: string
                contentHash:
                  type: string
                injectedWorkloads:
                  type: array
                  items:
                    type: string
                message:
                  type: string
