# trstctl audit feed receiver for rsyslog (P5-L5).
#
# Receives the trstctl syslog audit feed (RFC 5424 messages, octet-counted over
# TLS as RFC 5425 requires), keeps only trstctl's audit messages (APP-NAME
# trstctl, MSGID trstctl-audit), parses each audit record's JSON with
# mmjsonparse and writes one JSON object per line. Set the three certificate
# paths. For a receiver that requires mutual TLS (P5-L2), set
# StreamDriver.AuthMode to "x509/certvalid" and give the feed a client
# certificate the CA below issued, through its client_cert_ref.
global(
  DefaultNetstreamDriver="ossl"
  DefaultNetstreamDriverCAFile="/etc/trstctl/rsyslog/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/trstctl/rsyslog/server.crt"
  DefaultNetstreamDriverKeyFile="/etc/trstctl/rsyslog/server.key"
)
module(load="imtcp" StreamDriver.Name="ossl" StreamDriver.Mode="1" StreamDriver.AuthMode="anon")
module(load="mmjsonparse")
input(type="imtcp" port="6514" ruleset="trstctl_audit")
template(name="trstctl_audit_json" type="list") {
  property(name="$!all-json")
  constant(value="\n")
}
ruleset(name="trstctl_audit") {
  if $programname == "trstctl" and $msgid == "trstctl-audit" then {
    action(type="mmjsonparse" cookie="")
    if $parsesuccess == "OK" then {
      action(type="omfile" file="/var/log/trstctl/audit.json" template="trstctl_audit_json")
    }
  }
}
