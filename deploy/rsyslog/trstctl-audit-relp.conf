# trstctl audit feed receiver for rsyslog over RELP (P5-L3).
#
# Receives the trstctl syslog audit feed over RELP on TLS (the feed's
# endpoint_url is relp+tls://<host>:2514). rsyslog answers each RFC 5424
# message as it takes it, so the feed counts a batch delivered only when every
# message is acknowledged. Like trstctl-audit.conf, it keeps only trstctl's
# audit messages (APP-NAME trstctl, MSGID trstctl-audit), parses each audit
# record's JSON with mmjsonparse and writes one JSON object per line. Set the
# three certificate paths. A message over 128 KiB ends the session unanswered
# instead of being truncated, so the feed retries it rather than counting a
# cut record delivered.
global(maxMessageSize="128k")
module(load="imrelp")
module(load="mmjsonparse")
input(type="imrelp" port="2514" ruleset="trstctl_audit"
  maxDataSize="128k" oversizeMode="abort"
  tls="on"
  tls.caCert="/etc/trstctl/rsyslog/ca.pem"
  tls.myCert="/etc/trstctl/rsyslog/server.crt"
  tls.myPrivKey="/etc/trstctl/rsyslog/server.key")
template(name="trstctl_audit_json" type="list") {
  property(name="$!all-json")
  constant(value="\n")
}
ruleset(name="trstctl_audit") {
  if $programname == "trstctl" and $msgid == "trstctl-audit" then {
    action(type="mmjsonparse" cookie="")
    if $parsesuccess == "OK" then {
      action(type="omfile" file="/var/log/trstctl/audit.json" template="trstctl_audit_json")
    }
  }
}
