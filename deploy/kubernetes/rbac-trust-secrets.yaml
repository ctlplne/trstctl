# OPT-IN, cluster-scoped grant for TrustBundle Secret targets
# (`spec.target.secret` on a trstctl TrustBundle).
#
# rbac.yaml keeps Secret access to the agent's own namespace on purpose. A
# TrustBundle that names a Secret target writes an Opaque Secret holding the
# public CA bundle into every namespace it targets, which needs Secret read and
# write outside that namespace. The agent only creates Secrets it labels as its
# own and refuses to change one it did not create, but "get secrets"
# cluster-wide still lets the agent process read any Secret by name, so apply
# this only where that is acceptable. To allow a few namespaces instead, bind a
# namespaced Role with get, create, update and patch on secrets in each of them.
# Without either grant the bundle reports the namespace it could not write.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trstctl-agent-trust-secrets
  labels:
    app.kubernetes.io/name: trstctl-agent
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trstctl-agent-trust-secrets
  labels:
    app.kubernetes.io/name: trstctl-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trstctl-agent-trust-secrets
subjects:
  - kind: ServiceAccount
    name: trstctl-agent
    namespace: trstctl
