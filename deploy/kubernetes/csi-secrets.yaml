# OPT-IN: serve trstctl secrets to pods as inline CSI volumes
# (driver secrets.csi.trstctl.com), with no Kubernetes Secret object.
#
# A pod names its secrets in an inline CSI volume:
#
#   securityContext:
#     fsGroup: 2000            # the files are 0440, owned by root and this group
#   volumes:
#     - name: secrets
#       csi:
#         driver: secrets.csi.trstctl.com
#         readOnly: true
#         volumeAttributes:
#           secrets: "password=payments/prod/db-password,api-key=payments/prod/api-key"
#           freshness: 1h        # optional: serve the last values at most this long without the control plane
#           onStale: remove      # optional: remove (the default) or keep
#
# Trust boundary. The node plugin below holds no credential of its own and no
# Kubernetes API access: its service-account token is not mounted. For each
# volume the kubelet hands it the pod's own service-account token, minted for
# the "trstctl" audience; the plugin exchanges it at the control plane's
# machine login (a "kubernetes" method that trusts this cluster's issuer) for a
# short session, and reads only what that pod's identity may read. Values are
# written into a memory filesystem (tmpfs) the plugin mounts at the volume, so
# they never reach the node's disk, etcd or a Secret object, and they go when
# the pod does. Mounting needs CAP_SYS_ADMIN and bidirectional mount
# propagation, so the plugin's container is privileged: whoever controls it, or
# the node, can read the volumes of the pods on that node, as with any
# node-local secret delivery. requiresRepublish makes the kubelet publish
# volumes again periodically: a republish writes new versions, removes a file
# the pod may no longer read, and applies the freshness bound.
#
# Set the control plane in the ConfigMap below, then render the image digest
# before applying:
#   TRSTCTL_AGENT_DAEMONSET_TEMPLATE=deploy/kubernetes/csi-secrets.yaml \
#     scripts/release/render-kubernetes-agent-daemonset.sh ghcr.io/<owner>/trstctl@sha256:<digest>
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: secrets.csi.trstctl.com
  labels:
    app.kubernetes.io/name: trstctl-secrets-csi
spec:
  attachRequired: false
  # The kubelet marks a volume as inline ephemeral (the only kind this driver
  # serves) and names its pod only when this is true.
  podInfoOnMount: true
  requiresRepublish: true
  # The driver gives the files the pod's fsGroup itself: it asks the kubelet
  # for the group with the VOLUME_MOUNT_GROUP capability.
  fsGroupPolicy: File
  volumeLifecycleModes: ["Ephemeral"]
  # The pod's own token, for the control plane's machine login only, passed in
  # the request's secrets (which the kubelet keeps out of its logs).
  tokenRequests:
    - audience: trstctl
      expirationSeconds: 3600
  serviceAccountTokenInSecrets: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trstctl-secrets-csi
  namespace: trstctl
  labels:
    app.kubernetes.io/name: trstctl-secrets-csi
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trstctl-secrets-csi
  namespace: trstctl
  labels:
    app.kubernetes.io/name: trstctl-secrets-csi
data:
  # Drop ca_file when the control plane's certificate is publicly trusted.
  config.yaml: |
    server: https://trstctl.example.internal:8443
    ca_file: /etc/trstctl-secrets-csi/ca.pem
    tenant: REPLACE_WITH_THE_TENANT_ID
    login_method: kubernetes
    audience: trstctl
    state_dir: /csi/volumes
  ca.pem: |
    REPLACE_WITH_THE_CONTROL_PLANE_CA_CERTIFICATE_PEM
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: trstctl-secrets-csi
  namespace: trstctl
  labels:
    app.kubernetes.io/name: trstctl-secrets-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trstctl-secrets-csi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trstctl-secrets-csi
    spec:
      serviceAccountName: trstctl-secrets-csi
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets-csi
          image: ghcr.io/ctlplne/trstctl@sha256:RELEASE_DIGEST_REQUIRED
          command: ["/usr/local/bin/trstctl-agent"]
          args:
            - "--csi-secrets-socket=/csi/csi.sock"
            - "--csi-secrets-config=/etc/trstctl-secrets-csi/config.yaml"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # Mounting each volume's memory filesystem needs CAP_SYS_ADMIN, and
            # bidirectional mount propagation needs a privileged container.
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            # The kubelet names volume directories by their host path, so the
            # driver sees the pod directories at the same path; its mounts
            # propagate back to the host for the kubelet to hand to the pod.
            - name: pods-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: config
              mountPath: /etc/trstctl-secrets-csi
              readOnly: true
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar@sha256:11f199f6bec47403b03cb49c79a41f445884b213b382582a60710b8c6fdc316a # v2.15.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/secrets.csi.trstctl.com/csi.sock"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/secrets.csi.trstctl.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: config
          configMap:
            name: trstctl-secrets-csi
