# trstctl evaluation stack.
#
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# brings up the control plane against PostgreSQL and NATS JetStream. The control
# plane is wired to them as an EXTERNAL datastore configuration — which is
# exactly the code path you use when pointing trstctl at your own managed
# Postgres/NATS. To do that, override TRSTCTL_POSTGRES_DSN and TRSTCTL_NATS_URL
# (and drop the bundled postgres/nats services).
#
# ============================================================================
#  NOT FOR PRODUCTION — EVALUATION ONLY (OPS-007).
#  This file bakes a STATIC Postgres user/password (trstctl/trstctl) and
#  connects with sslmode=disable so the stack comes up with zero setup. Both are
#  fine for a throwaway local eval and unacceptable in production:
#    * the DB credentials are public and identical for every reader of this repo;
#    * sslmode=disable sends the DSN's password and all query traffic in the clear.
#  For a real deployment use the Helm chart (deploy/helm/trstctl), which sources
#  the Postgres DSN and the KEK from a Kubernetes Secret (kek.generate=true mints
#  a random KEK; helm-lint requires sslmode=require). To harden THIS compose
#  stack instead, set a generated password and require TLS, e.g.:
#    printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > deploy/docker/.env
#  then reference ${POSTGRES_PASSWORD} below and switch the DSN to sslmode=require
#  with the server's CA mounted. See docs/limitations.md / the Helm Secret path.
# ============================================================================

name: trstctl

services:
  postgres:
    # Built locally from the exact upstream 16.15 Alpine digest. The small
    # derivative removes upstream's unused vulnerable gosu helper, then starts
    # directly as the existing postgres account. See Dockerfile.postgres.
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.postgres
    image: trstctl-postgres-hardened:local
    user: "postgres"
    environment:
      POSTGRES_DB: trstctl
      # EVAL-ONLY static credentials (OPS-007): public and identical for everyone.
      # Never reuse these in production — see the banner at the top of this file.
      POSTGRES_USER: trstctl
      POSTGRES_PASSWORD: trstctl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trstctl -d trstctl"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    # Digest-pinned (SUPPLY-008); tag for humans: nats:2.10-alpine.
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    # JetStream is the event spine (AN-2), file-backed under /data.
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # EVALUATION ONLY — generate one stable local IdP signing keypair. The private
  # half is mounted only into eval-oidc; trstctl receives the public JWKS. Keeping
  # the pair in a named volume preserves browser-login continuity across restart.
  oidc-keys:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.node
    image: trstctl-node-hardened:local
    environment:
      OIDC_PRIVATE_KEY_DIR: /local-oidc-private
      OIDC_JWKS_DIR: /local-oidc-public
      OIDC_KEY_ID: trstctl-eval-idp
    command: ["node", "/local/oidc-keygen.mjs"]
    volumes:
      - evaloidcprivate:/local-oidc-private
      - evaloidcpublic:/local-oidc-public
      - ../local-oidc/oidc-keygen.mjs:/local/oidc-keygen.mjs:ro

  # The signing service runs as its OWN service (AN-4 / R3.2): process isolation is
  # also deployment isolation. Its CA key is sealed at rest in a persistent volume,
  # so a restart preserves the issuing CA instead of silently rotating it.
  signer:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: release
      args:
        COMMIT: "${TRSTCTL_BUILD_COMMIT:-none}"
        DATE: "${TRSTCTL_BUILD_DATE:-1970-01-01T00:00:00Z}"
    # Local eval image built from this checkout, not a mutable registry tag.
    image: trstctl-eval:local
    # Self-heal a transient first-boot hiccup (e.g. the shared volume not yet
    # populated). The image is distroless (no shell), so readiness is expressed by
    # restart-until-up rather than a CMD healthcheck.
    restart: on-failure
    entrypoint: ["/usr/local/bin/trstctl-signer"]
    command:
      - "--socket=/run/trstctl/signer.sock"
      - "--keystore=/data/signer/keys"
      - "--kek=/data/secrets/kek.bin"
      - "--auth-secret=/data/secrets/sign-auth.bin"
      - "--legacy-audit-key=/data/audit/signing-key.pem"
    volumes:
      - signersock:/run/trstctl   # UDS shared with the control plane
      - signerkeys:/data/signer   # sealed CA-key custody (survives restart)
      - secrets:/data/secrets     # the deployment KEK (shared with the control plane)
      - trstctldata:/data         # one-time legacy audit PEM migration; signer deletes it after sealing

  trstctl:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: release
      args:
        COMMIT: "${TRSTCTL_BUILD_COMMIT:-none}"
        DATE: "${TRSTCTL_BUILD_DATE:-1970-01-01T00:00:00Z}"
    # Local eval image built from this checkout, not a mutable registry tag.
    image: trstctl-eval:local
    # The control plane reads the shared KEK and dials the signer's UDS during boot;
    # on a cold first boot the signer may not be listening within the dial window, so
    # restart-on-failure lets the control plane retry until the signer is up (the
    # signer creates the shared kek.bin and binds the socket first).
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      signer:
        condition: service_started
      oidc-keys:
        condition: service_completed_successfully
    environment:
      TRSTCTL_SERVER_ADDR: ":8443"
      # External-datastore configuration (the tested external path).
      TRSTCTL_POSTGRES_MODE: external
      # EVAL ONLY — do not reuse these credentials or sslmode=disable in production
      # (OPS-007). The static trstctl:trstctl password is public, and
      # sslmode=disable sends it (and all traffic) in the clear. Production should
      # source the DSN from a Secret and use sslmode=require with the server's CA —
      # the Helm chart (deploy/helm/trstctl) does exactly this. See the file banner.
      TRSTCTL_POSTGRES_DSN: "postgres://trstctl:trstctl@postgres:5432/trstctl?sslmode=disable"
      TRSTCTL_NATS_MODE: external
      TRSTCTL_NATS_URL: "nats://nats:4222"
      # EVAL ONLY — this Compose stack is a single NATS server, so it explicitly
      # opts into one JetStream replica. Production external NATS must stay
      # replicated (default 3) and will fail readiness/startup if under-replicated.
      TRSTCTL_NATS_REPLICAS: "1"
      TRSTCTL_NATS_ALLOW_SINGLE_REPLICA: "true"
      TRSTCTL_LOG_FORMAT: json
      # AN-7 bulkheads: workers bound concurrent subsystem work; queue bounds
      # accepted backlog before fast backpressure. Override these for bigger evals.
      TRSTCTL_BULKHEAD_API_WORKERS: "8"
      TRSTCTL_BULKHEAD_API_QUEUE: "256"
      TRSTCTL_BULKHEAD_PROJECTIONS_WORKERS: "2"
      TRSTCTL_BULKHEAD_PROJECTIONS_QUEUE: "128"
      TRSTCTL_BULKHEAD_OUTBOX_WORKERS: "4"
      TRSTCTL_BULKHEAD_OUTBOX_QUEUE: "256"
      TRSTCTL_BULKHEAD_SIGNING_WORKERS: "4"
      TRSTCTL_BULKHEAD_SIGNING_QUEUE: "64"
      TRSTCTL_BULKHEAD_QUERY_WORKERS: "4"
      TRSTCTL_BULKHEAD_QUERY_QUEUE: "64"
      TRSTCTL_BULKHEAD_POLICY_WORKERS: "4"
      TRSTCTL_BULKHEAD_POLICY_QUEUE: "64"
      TRSTCTL_BULKHEAD_PROTOCOLS_WORKERS: "8"
      TRSTCTL_BULKHEAD_PROTOCOLS_QUEUE: "256"
      TRSTCTL_BULKHEAD_AGENT_WORKERS: "16"
      TRSTCTL_BULKHEAD_AGENT_QUEUE: "1024"
      # Connect to the separately deployed signer over its UDS (R3.2). The CA cert
      # and the KEK persist so the issuing CA is stable across restarts.
      TRSTCTL_SIGNER_MODE: external
      TRSTCTL_SIGNER_SOCKET: /run/trstctl/signer.sock
      # EVAL ONLY — local Compose has no independent approval-token service, so the
      # control plane may mint signer tokens from the shared secret. Production
      # external NATS rejects this flag; use TRSTCTL_SIGNER_AUTH_TOKEN_COMMAND with
      # an independent approval authority instead.
      TRSTCTL_SIGNER_ALLOW_CO_RESIDENT_AUTHORIZER: "true"
      TRSTCTL_SIGNER_AUTH_SECRET_FILE: /data/secrets/sign-auth.bin
      TRSTCTL_SECRETS_KEK_FILE: /data/secrets/kek.bin
      TRSTCTL_CA_CERT_FILE: /data/ca/issuing-ca.crt
      # EVAL ONLY — the blank first-run wizard enrolls a live agent. The product
      # default remains off so upgrades do not silently open an agent port; this
      # stack opts in and publishes host 19443 -> container 9443 and host 19444 ->
      # container 9444 so they do not collide with the demo stack's 127.0.0.1:9443 UI.
      TRSTCTL_AGENT_CHANNEL_ENABLED: "true"
      TRSTCTL_AGENT_CHANNEL_ADDR: ":9443"
      # The browser must publish the HOST-side address, not guess from the
      # container listener. This keeps its install command correct when ports are
      # remapped by Compose, a Service, a load balancer, or a tunnel.
      TRSTCTL_AGENT_CHANNEL_PUBLIC_ADDRESS: "localhost:19443"
      TRSTCTL_AGENT_CHANNEL_HTTP_RENEWAL_ADDR: ":9444"
      TRSTCTL_AGENT_CHANNEL_CA_CERT_FILE: /data/ca/agent-ca.crt
      # EVALUATION ONLY — match the actions exposed by the blank-stack console.
      # Production keeps the allowlist empty until an operator explicitly enables
      # each estate-touching executor.
      TRSTCTL_AGENT_CHANNEL_CLAIMABLE_JOB_KINDS: "discovery.run,endpoint.verify,connector.test"
      # EVAL ONLY — one explicit preset enables every shipped enrollment/timestamp
      # protocol against the deterministic eval tenant. Production defaults remain
      # off. Operators can choose another eval tenant before `docker compose up`
      # without hand-editing seven protocol blocks.
      TRSTCTL_PROTOCOLS_PROFILE: "eval"
      TRSTCTL_PROTOCOLS_EVAL_TENANT_ID: "${COMPOSE_E2E_TENANT:-11111111-1111-4111-8111-111111111111}"
      TRSTCTL_PROTOCOLS_SPIFFE_SOCKET_PATH: /run/trstctl-spiffe/workload.sock
      # TLS is on by default (server.tls.mode=internal): the control plane serves
      # HTTPS with a self-signed certificate, so reach it at https://localhost:8443
      # and verify with the certificate-only public trust file below.
      # For production set TRSTCTL_SERVER_TLS_MODE=file with your certificate.
      TRSTCTL_SERVER_TLS_INTERNAL_TRUST_FILE: /public-trust/control-plane.crt
      # EVALUATION ONLY — a loopback-only local IdP gives the first operator a
      # real browser session instead of leaving a healthy blank stack behind an
      # unconfigured-login wall. The product default remains authentication-off
      # and fail-closed; production must configure its own OIDC, SAML, or LDAP.
      TRSTCTL_AUTH_OIDC_ENABLED: "true"
      TRSTCTL_AUTH_OIDC_ISSUER: "http://127.0.0.1:18081"
      TRSTCTL_AUTH_OIDC_CLIENT_ID: trstctl-eval-ui
      TRSTCTL_AUTH_OIDC_AUTH_ENDPOINT: "http://127.0.0.1:18081/authorize"
      TRSTCTL_AUTH_OIDC_TOKEN_ENDPOINT: "http://127.0.0.1:18081/token"
      TRSTCTL_AUTH_OIDC_REDIRECT_URI: "https://localhost:8443/auth/callback"
      TRSTCTL_AUTH_OIDC_JWKS_FILE: /local-oidc-public/jwks.json
      TRSTCTL_AUTH_OIDC_SESSION_SECRET_FILE: /data/secrets/oidc-session.secret
      TRSTCTL_AUTH_OIDC_SESSION_TTL: 8h
      TRSTCTL_AUTH_OIDC_LOGIN_REDIRECT: /
      TRSTCTL_AUTH_OIDC_TENANT_CLAIM: tenant
      TRSTCTL_AUTH_OIDC_CLAIM_IS_TENANT: "true"
      TRSTCTL_AUTH_OIDC_DEFAULT_ROLES: admin
    volumes:
      - signersock:/run/trstctl   # reach the signer over the shared UDS
      - spiffesock:/run/trstctl-spiffe # mount this volume into a workload container to use the SPIFFE Workload API
      - secrets:/data/secrets     # the same deployment KEK as the signer
      - trstctldata:/data         # CA cert + audit key persistence
      - publictrust:/public-trust # certificate-only trust publication; no private TLS state
      - evaloidcpublic:/local-oidc-public:ro # public JWKS only; the IdP private volume is not mounted here
    ports:
      # The automatic eval administrator is safe only on the same workstation.
      # Bind every published blank-eval listener to host loopback by default.
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:19443:9443"
      - "127.0.0.1:19444:9444"
    healthcheck:
      # Distroless has no shell; the binary probes its own /healthz over the same
      # transport the server uses (HTTPS by default).
      test: ["CMD", "/usr/local/bin/trstctl", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # EVALUATION ONLY — a one-user OIDC provider for the blank first-run journey.
  # Its host listener is loopback-only. The shared implementation issues opaque,
  # short-lived, single-use authorization codes bound to PKCE and this one exact
  # callback; it is not a production identity provider.
  eval-oidc:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.node
    image: trstctl-node-hardened:local
    restart: on-failure
    depends_on:
      trstctl:
        condition: service_started
      oidc-keys:
        condition: service_completed_successfully
    environment:
      OIDC_HOST: "0.0.0.0"
      OIDC_PORT: "18081"
      OIDC_ISSUER: "http://127.0.0.1:18081"
      OIDC_CLIENT_ID: trstctl-eval-ui
      OIDC_REDIRECT_URI: "https://localhost:8443/auth/callback"
      OIDC_TENANT: "${COMPOSE_E2E_TENANT:-11111111-1111-4111-8111-111111111111}"
      OIDC_SUBJECT: eval-admin
      OIDC_EMAIL: eval-admin@trstctl.local
      OIDC_NAME: Evaluation Admin
      OIDC_KEY_ID: trstctl-eval-idp
      OIDC_PRIVATE_KEY: /local-oidc-private/idp-private.pem
      OIDC_JWKS: /local-oidc-public/jwks.json
    command: ["node", "/local/oidc-server.mjs"]
    volumes:
      - evaloidcprivate:/local-oidc-private:ro
      - evaloidcpublic:/local-oidc-public:ro
      - ../local-oidc/oidc-server.mjs:/local/oidc-server.mjs:ro
    ports:
      - "127.0.0.1:18081:18081"

  # trstctl's SSRF guard correctly permits HTTP only to literal loopback. This
  # tiny TCP bridge shares trstctl's network namespace and forwards that exact
  # loopback address to the project-local IdP service.
  oidc-loopback:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.node
    image: trstctl-node-hardened:local
    network_mode: "service:trstctl"
    restart: on-failure
    depends_on:
      trstctl:
        condition: service_started
        # This bridge joins trstctl's network namespace. Compose must recreate it
        # whenever an operator explicitly restarts or replaces that container;
        # otherwise it keeps listening in the retired namespace and fresh SSO
        # callbacks fail even though both services look healthy.
        restart: true
      eval-oidc:
        condition: service_started
    command:
      - "node"
      - "-e"
      - |
        const net = require("node:net");
        net.createServer((client) => {
          const upstream = net.connect(18081, "eval-oidc");
          client.pipe(upstream);
          upstream.pipe(client);
          upstream.on("error", () => client.destroy());
          client.on("error", () => upstream.destroy());
        }).listen(18081, "127.0.0.1", () => {
          console.log("evaluation OIDC loopback proxy listening on 127.0.0.1:18081");
        });

volumes:
  pgdata:
  natsdata:
  signersock:
  spiffesock:
  signerkeys:
  secrets:
  trstctldata:
  publictrust:
  evaloidcprivate:
  evaloidcpublic:
