stages:
  - plan
  - apply

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TRSTCTL_TERRAFORM_DIR: "deploy/iac/gitops/base"

trstctl:terraform:plan:
  stage: plan
  # Digest-pinned, not a floating tag (SUPPLY-008; enforced by
  # scripts/ci/check-compose-images-pinned.sh). Tag for humans: 1.9.8.
  image: hashicorp/terraform:1.9.8@sha256:18f9986038bbaf02cf49db9c09261c778161c51dcc7fb7e355ae8938459428cd
  script:
    - cd "$TRSTCTL_TERRAFORM_DIR"
    - terraform init -input=false
    - terraform plan -input=false
      -var="trstctl_endpoint=${TRSTCTL_ENDPOINT}"
      -var="trstctl_token=${TRSTCTL_TOKEN}"
  rules:
    - if: '$TRSTCTL_ENDPOINT && $TRSTCTL_TOKEN'

trstctl:terraform:apply:
  stage: apply
  # Digest-pinned (SUPPLY-008); tag for humans: 1.9.8.
  image: hashicorp/terraform:1.9.8@sha256:18f9986038bbaf02cf49db9c09261c778161c51dcc7fb7e355ae8938459428cd
  needs: ["trstctl:terraform:plan"]
  script:
    - cd "$TRSTCTL_TERRAFORM_DIR"
    - terraform init -input=false
    - terraform apply -input=false -auto-approve
      -var="trstctl_endpoint=${TRSTCTL_ENDPOINT}"
      -var="trstctl_token=${TRSTCTL_TOKEN}"
  rules:
    - if: '$TRSTCTL_ENDPOINT && $TRSTCTL_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
