pid /lab/run/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  server {
    listen 10444 ssl;
    server_name nginx.partner-lab.example.com;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /lab/tls/nginx.crt;
    ssl_certificate_key /lab/tls/nginx.key;
    location / { add_header X-Trstctl-Lab real-nginx always; return 200 "trstctl real NGINX target\n"; }
  }
  # The provider journey's customer listener: a separate server block whose
  # certificate lives under /lab/tls/customer-edge and is managed only by the
  # customer tenant's own agent (its host profile is limited to that directory).
  server {
    listen 10449 ssl;
    server_name customer-edge.acme-robotics.example.com;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /lab/tls/customer-edge/edge.crt;
    ssl_certificate_key /lab/tls/customer-edge/edge.key;
    location / { add_header X-Trstctl-Lab real-nginx-customer-edge always; return 200 "trstctl real NGINX customer target\n"; }
  }
}
