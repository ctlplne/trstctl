# This is a disposable, loopback-only PostgreSQL TLS target for the partner lab.
# The process shares one network namespace and one credential volume with the
# nonroot trstctl edge collector, matching a co-resident host deployment. The
# container's service port is reachable only on the private Compose network and
# through a host-loopback-only publish; pg_hba.conf rejects database sessions.
listen_addresses = '*'
port = 10448
unix_socket_directories = '/lab/run'
ssl = on
ssl_cert_file = '/lab/tls/postgresql.crt'
ssl_key_file = '/lab/tls/postgresql.key'
max_connections = 12
shared_buffers = '16MB'
log_destination = 'stderr'
logging_collector = off
