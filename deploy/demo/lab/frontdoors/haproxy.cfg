global
  log stdout format raw local0
  stats socket /lab/run/haproxy.sock mode 600 level admin

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend partner_lab_https
  bind :10445 ssl crt /lab/tls/haproxy.pem
  http-request return status 200 content-type text/plain hdr X-Trstctl-Lab real-haproxy string "trstctl real HAProxy target\n"
