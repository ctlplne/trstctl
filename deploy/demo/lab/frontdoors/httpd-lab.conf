ServerName apache.partner-lab.example.com:10443
PidFile /lab/run/httpd.pid
SSLSessionCache "shmcb:/lab/run/apache-ssl-cache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost *:10443>
    ServerName apache.partner-lab.example.com
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /lab/tls/apache.crt
    SSLCertificateKeyFile /lab/tls/apache.key
    Header always set X-Trstctl-Lab "real-apache"
</VirtualHost>
