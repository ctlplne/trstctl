# trstctl live-demo stack.
#
#   docker compose -f deploy/demo/docker-compose.yml up --build
#
# This is the click-through demo environment: local browser SSO, pre-populated
# tenant data, signer-backed certificates, secrets, transit keys, and LocalStack
# KMS-backed managed keys. It intentionally uses a different command, project
# name, data volumes, and host ports than deploy/docker/docker-compose.yml so the
# blank operational/eval stack can run beside it.
#
# Every third-party image below is pinned by @sha256 digest, not a floating tag,
# so the demo is reproducible and cannot silently inherit a changed/ vulnerable
# image (SUPPLY-008). The human-readable tag is kept in the ref. Enforced by
# scripts/ci/check-compose-images-pinned.sh; Dependabot's docker updater
# (directory /deploy/demo) bumps the digests in place.

name: trstctl-demo

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: trstctl
      POSTGRES_USER: trstctl
      POSTGRES_PASSWORD: trstctl_demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trstctl -d trstctl"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8.1@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    environment:
      SERVICES: kms
      LS_LOG: warn
    volumes:
      - localstack:/var/lib/localstack

  oidc-keys:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    environment:
      OIDC_KEY_DIR: /demo-oidc
      OIDC_KEY_ID: trstctl-demo-idp
    command: ["node", "/local/oidc-keygen.mjs"]
    volumes:
      - demoidp:/demo-oidc
      - ../local-oidc/oidc-keygen.mjs:/local/oidc-keygen.mjs:ro

  managedkeys-config:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    command:
      - "node"
      - "-e"
      - |
        const fs = require("node:fs");
        const dir = "/demo-managed-keys";
        const secretPath = `$${dir}/aws-secret-access-key`;
        const configPath = `$${dir}/provider.json`;
        fs.writeFileSync(secretPath, "test", { mode: 0o600 });
        fs.writeFileSync(configPath, JSON.stringify({
          enabled: true,
          provider: "aws",
          aws: {
            region: "us-east-1",
            endpoint: "http://127.0.0.1:4566",
            allow_insecure_loopback: true,
            access_key_id: "test",
            secret_access_key_file: secretPath,
          },
        }), { mode: 0o600 });
        fs.chownSync(secretPath, 65532, 65532);
        fs.chownSync(configPath, 65532, 65532);
    volumes:
      - managedkeys:/demo-managed-keys

  signer:
    # The assembled AUD-68 proof overrides this tag with a project-unique value.
    # Ordinary demo use keeps the stable local default. Only trstctl builds this
    # image: the demo target generates a fresh license key, so two independent
    # builds cannot safely race to own one tag.
    image: ${TRSTCTL_DEMO_CONTROL_IMAGE:-ctlplne-demo-control:local}
    pull_policy: never
    user: "65532:65532"
    restart: on-failure
    depends_on:
      localstack:
        condition: service_started
      managedkeys-config:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/trstctl-signer"]
    command:
      - "--socket=/run/trstctl/signer.sock"
      - "--keystore=/data/signer/keys"
      - "--kek=/data/secrets/kek.bin"
      - "--auth-secret=/data/secrets/sign-auth.bin"
      - "--legacy-audit-key=/data/audit/signing-key.pem"
      - "--license=/etc/trstctl/demo-provider-license.json"
      - "--license-deployment-id=trstctl-local-demo"
      - "--license-environment=non_production"
      - "--managed-keys-config=/demo-managed-keys/provider.json"
    volumes:
      - signersock:/run/trstctl
      - signerkeys:/data/signer
      - secrets:/data/secrets
      - managedkeys:/demo-managed-keys:ro
      - trstctldata:/data

  trstctl:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: demo
    image: ${TRSTCTL_DEMO_CONTROL_IMAGE:-ctlplne-demo-control:local}
    user: "65532:65532"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      signer:
        condition: service_started
      localstack:
        condition: service_started
      managedkeys-config:
        condition: service_completed_successfully
      oidc-keys:
        condition: service_completed_successfully
    environment:
      TRSTCTL_SERVER_ADDR: ":8443"
      # Internal TLS keeps private key state in /data but publishes a separate
      # certificate-only trust file. Seeder and other clients receive only this
      # public volume; they never mount the control plane's private data volume.
      TRSTCTL_SERVER_TLS_INTERNAL_TRUST_FILE: /public-trust/control-plane.crt
      # A5: the agent channel is OFF by default, which is the right production
      # default and wrong for a demo. Without it the seed job advertises agent
      # enrollment tokens that nothing can redeem — an evaluator gets a token,
      # starts an agent, and it cannot dial anything. Turning it on here makes
      # the advertised tokens mean something.
      TRSTCTL_AGENT_CHANNEL_ENABLED: "true"
      TRSTCTL_AGENT_CHANNEL_ADDR: ":9443"
      # The signer key and its public trust anchor must cross the same container
      # recreation boundary. The key is in signerkeys; this certificate is in the
      # shared persistent /data volume (AUD-100).
      TRSTCTL_AGENT_CHANNEL_CA_CERT_FILE: /data/ca/agent-ca.crt
      # An empty claimable set serves the job ledger and hands nothing out, so an
      # enrolled agent idles while every surface looks healthy. Deliberately
      # excludes connector.deploy: a demo stack must not mutate an appliance
      # somebody pointed it at by accident.
      TRSTCTL_AGENT_CHANNEL_CLAIMABLE_JOB_KINDS: "discovery.run,endpoint.verify,connector.test"
      TRSTCTL_POSTGRES_MODE: external
      TRSTCTL_POSTGRES_DSN: "postgres://trstctl:trstctl_demo@postgres:5432/trstctl?sslmode=disable"
      TRSTCTL_NATS_MODE: external
      TRSTCTL_NATS_URL: "nats://nats:4222"
      TRSTCTL_NATS_REPLICAS: "1"
      TRSTCTL_NATS_ALLOW_SINGLE_REPLICA: "true"
      TRSTCTL_OUTBOUND_ENV_CREDENTIAL_REFS: "env:TRSTCTL_DISCOVERY_AWS_ACCESS_KEY_ID,env:TRSTCTL_DISCOVERY_AWS_SECRET_ACCESS_KEY,env:TRSTCTL_DISCOVERY_GCP_TOKEN,env:TRSTCTL_DISCOVERY_AWS_SM_ACCESS_KEY_ID,env:TRSTCTL_DISCOVERY_AWS_SM_SECRET_ACCESS_KEY,env:TRSTCTL_DISCOVERY_GCP_SM_TOKEN"
      TRSTCTL_LOG_FORMAT: json
      TRSTCTL_BULKHEAD_API_WORKERS: "8"
      TRSTCTL_BULKHEAD_API_QUEUE: "256"
      TRSTCTL_BULKHEAD_PROJECTIONS_WORKERS: "2"
      TRSTCTL_BULKHEAD_PROJECTIONS_QUEUE: "128"
      TRSTCTL_BULKHEAD_OUTBOX_WORKERS: "4"
      TRSTCTL_BULKHEAD_OUTBOX_QUEUE: "256"
      TRSTCTL_BULKHEAD_SIGNING_WORKERS: "4"
      TRSTCTL_BULKHEAD_SIGNING_QUEUE: "64"
      TRSTCTL_BULKHEAD_QUERY_WORKERS: "4"
      TRSTCTL_BULKHEAD_QUERY_QUEUE: "64"
      TRSTCTL_BULKHEAD_POLICY_WORKERS: "4"
      TRSTCTL_BULKHEAD_POLICY_QUEUE: "64"
      TRSTCTL_BULKHEAD_PROTOCOLS_WORKERS: "8"
      TRSTCTL_BULKHEAD_PROTOCOLS_QUEUE: "256"
      TRSTCTL_BULKHEAD_AGENT_WORKERS: "16"
      TRSTCTL_BULKHEAD_AGENT_QUEUE: "1024"
      TRSTCTL_SIGNER_MODE: external
      TRSTCTL_SIGNER_SOCKET: /run/trstctl/signer.sock
      TRSTCTL_SIGNER_ALLOW_CO_RESIDENT_AUTHORIZER: "true"
      TRSTCTL_SIGNER_AUTH_SECRET_FILE: /data/secrets/sign-auth.bin
      TRSTCTL_SECRETS_KEK_FILE: /data/secrets/kek.bin
      # The external signer owns the audit key. Keeping the retired PEM path
      # explicit makes every local admin command enforce the same migration
      # fail-closed check against the shared /data volume.
      TRSTCTL_AUDIT_SIGNING_KEY_FILE: /data/audit/signing-key.pem
      TRSTCTL_SECRETS_ENABLE_API: "true"
      # The Access-tab Job 2 uses the built-in HMAC machine-login method. The
      # server creates this root 0600 on first boot in the existing secrets
      # volume; it is never placed inline in Compose or rendered by the UI.
      TRSTCTL_SECRETS_AUTH_SECRET_FILE: /data/secrets/machine-auth.bin
      TRSTCTL_LICENSE_FILE: /etc/trstctl/demo-provider-license.json
      # The demo is explicitly one licensed non-production deployment. Binding
      # the runtime identity to the baked v2 entitlement prevents copying the
      # click-through license to an unrelated control plane.
      TRSTCTL_LICENSE_DEPLOYMENT_ID: trstctl-local-demo
      TRSTCTL_LICENSE_ENVIRONMENT: non_production
      # The shortest seeded profile lives for one hour. A 5-minute renewal
      # window keeps that exact issued/deployed demo lifecycle stable while the
      # walkthrough runs; the old 168-hour window renewed 1h/7d rows as soon as
      # they were seeded and made preserved-volume convergence impossible.
      TRSTCTL_LIFECYCLE_RENEW_BEFORE: "5m"
      TRSTCTL_CA_CERT_FILE: /data/ca/issuing-ca.crt
      TRSTCTL_CA_PUBLIC_CERT_FILE: /public-trust/issuing-ca.crt
      TRSTCTL_AUTH_OIDC_ENABLED: "true"
      TRSTCTL_AUTH_OIDC_ISSUER: "http://127.0.0.1:19081"
      TRSTCTL_AUTH_OIDC_CLIENT_ID: trstctl-demo-ui
      TRSTCTL_AUTH_OIDC_AUTH_ENDPOINT: "http://127.0.0.1:19081/authorize"
      TRSTCTL_AUTH_OIDC_TOKEN_ENDPOINT: "http://127.0.0.1:19081/token"
      TRSTCTL_AUTH_OIDC_REDIRECT_URI: "https://localhost:9443/auth/callback"
      TRSTCTL_AUTH_OIDC_JWKS_FILE: /demo-oidc/jwks.json
      TRSTCTL_AUTH_OIDC_SESSION_SECRET_FILE: /data/secrets/oidc-session.secret
      TRSTCTL_AUTH_OIDC_SESSION_TTL: 8h
      TRSTCTL_AUTH_OIDC_LOGIN_REDIRECT: /
      TRSTCTL_AUTH_OIDC_TENANT_CLAIM: tenant
      TRSTCTL_AUTH_OIDC_CLAIM_IS_TENANT: "true"
      TRSTCTL_AUTH_OIDC_DEFAULT_ROLES: admin
      TRSTCTL_MANAGED_KEYS_ENABLED: "true"
      TRSTCTL_MANAGED_KEYS_PROVIDER: aws
      TRSTCTL_MANAGED_KEYS_AWS_REGION: us-east-1
      TRSTCTL_MANAGED_KEYS_AWS_ENDPOINT: "http://127.0.0.1:4566"
      TRSTCTL_MANAGED_KEYS_AWS_ALLOW_INSECURE_LOOPBACK: "true"
      TRSTCTL_MANAGED_KEYS_AWS_ACCESS_KEY_ID: test
      TRSTCTL_MANAGED_KEYS_AWS_SECRET_ACCESS_KEY_FILE: /demo-managed-keys/aws-secret-access-key
      TRSTCTL_PROTOCOLS_ACME_ENABLED: "true"
      TRSTCTL_PROTOCOLS_ACME_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      TRSTCTL_PROTOCOLS_EST_ENABLED: "true"
      TRSTCTL_PROTOCOLS_EST_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      # The demo serves the real workload/SSH control paths, but it ships with
      # no fabricated attestation. An evaluator must add a tenant-scoped public
      # trust source before either mint accepts evidence.
      TRSTCTL_ATTESTED_ISSUANCE_ENABLED: "true"
      TRSTCTL_ATTESTED_ISSUANCE_TRUST_DOMAIN: demo.trstctl.local
      TRSTCTL_ATTESTED_ISSUANCE_DEFAULT_TTL: 10m
      TRSTCTL_ATTESTED_ISSUANCE_MAX_TTL: 1h
      TRSTCTL_PROTOCOLS_SSH_ENABLED: "true"
      TRSTCTL_PROTOCOLS_SSH_TENANT_ID: "11111111-1111-4111-8111-111111111111"
    volumes:
      - signersock:/run/trstctl
      - secrets:/data/secrets
      - trstctldata:/data
      - publictrust:/public-trust
      - demoidp:/demo-oidc:ro
      - managedkeys:/demo-managed-keys:ro
    ports:
      # Automatic demo administration is safe only on the same workstation.
      - "127.0.0.1:9443:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/trstctl", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  demo-oidc:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    restart: on-failure
    depends_on:
      trstctl:
        condition: service_started
      oidc-keys:
        condition: service_completed_successfully
    environment:
      OIDC_HOST: "0.0.0.0"
      OIDC_PORT: "19081"
      OIDC_ISSUER: "http://127.0.0.1:19081"
      OIDC_CLIENT_ID: trstctl-demo-ui
      OIDC_REDIRECT_URI: "https://localhost:9443/auth/callback"
      OIDC_TENANT: "11111111-1111-4111-8111-111111111111"
      OIDC_SUBJECT: demo-admin
      OIDC_EMAIL: demo-admin@trstctl.local
      OIDC_NAME: Demo Admin
      OIDC_KEY_ID: trstctl-demo-idp
      OIDC_PRIVATE_KEY: /demo-oidc/idp-private.pem
      OIDC_JWKS: /demo-oidc/jwks.json
    command: ["node", "/local/oidc-server.mjs"]
    volumes:
      - demoidp:/demo-oidc:ro
      - ../local-oidc/oidc-server.mjs:/local/oidc-server.mjs:ro
    ports:
      - "127.0.0.1:19081:19081"

  oidc-loopback:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    network_mode: "service:trstctl"
    restart: on-failure
    depends_on:
      trstctl:
        condition: service_started
        restart: true
      demo-oidc:
        condition: service_started
    command:
      - "node"
      - "-e"
      - |
        const net = require("node:net");
        net.createServer((client) => {
          const upstream = net.connect(19081, "demo-oidc");
          client.pipe(upstream);
          upstream.pipe(client);
          upstream.on("error", () => client.destroy());
          client.on("error", () => upstream.destroy());
        }).listen(19081, "127.0.0.1", () => {
          console.log("demo OIDC loopback proxy listening on 127.0.0.1:19081");
        });

  localstack-loopback:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    network_mode: "service:trstctl"
    restart: on-failure
    depends_on:
      trstctl:
        condition: service_started
        restart: true
      localstack:
        condition: service_started
    command:
      - "node"
      - "-e"
      - |
        const net = require("node:net");
        net.createServer((client) => {
          const upstream = net.connect(4566, "localstack");
          client.pipe(upstream);
          upstream.pipe(client);
          upstream.on("error", () => client.destroy());
          client.on("error", () => upstream.destroy());
        }).listen(4566, "127.0.0.1", () => {
          console.log("LocalStack loopback proxy listening on 127.0.0.1:4566");
        });

  localstack-signer-loopback:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    network_mode: "service:signer"
    restart: on-failure
    depends_on:
      signer:
        condition: service_started
        restart: true
      localstack:
        condition: service_started
    command:
      - "node"
      - "-e"
      - |
        const net = require("node:net");
        net.createServer((client) => {
          const upstream = net.connect(4566, "localstack");
          client.pipe(upstream);
          upstream.pipe(client);
          upstream.on("error", () => client.destroy());
          client.on("error", () => upstream.destroy());
        }).listen(4566, "127.0.0.1", () => {
          console.log("signer LocalStack loopback proxy listening on 127.0.0.1:4566");
        });

  demo-seed:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile.seed
    image: ${TRSTCTL_DEMO_SEED_IMAGE:-ctlplne-demo-seed:local}
    # The signer UDS is 0600 with SO_PEERCRED restricted to the signer's uid,
    # and the shared custody files are owned 0600 by this same nonroot identity.
    # Pinning the admin/seed process to 65532 is therefore part of the boundary,
    # not merely container hardening.
    user: "65532:65532"
    depends_on:
      signer:
        condition: service_started
      trstctl:
        condition: service_healthy
      demo-oidc:
        condition: service_started
      localstack:
        condition: service_started
      localstack-loopback:
        condition: service_started
      localstack-signer-loopback:
        condition: service_started
    environment:
      TRSTCTL_POSTGRES_MODE: external
      TRSTCTL_POSTGRES_DSN: "postgres://trstctl:trstctl_demo@postgres:5432/trstctl?sslmode=disable"
      TRSTCTL_NATS_MODE: external
      TRSTCTL_NATS_URL: "nats://nats:4222"
      TRSTCTL_NATS_REPLICAS: "1"
      TRSTCTL_NATS_ALLOW_SINGLE_REPLICA: "true"
      # `trstctl token create` runs in this container before the HTTPS seed. It
      # must join the already-running deployment custody boundary instead of
      # starting a disposable child signer and creating a private relative KEK.
      TRSTCTL_SIGNER_MODE: external
      TRSTCTL_SIGNER_SOCKET: /run/trstctl/signer.sock
      TRSTCTL_SIGNER_ALLOW_CO_RESIDENT_AUTHORIZER: "true"
      TRSTCTL_SIGNER_AUTH_SECRET_FILE: /data/secrets/sign-auth.bin
      TRSTCTL_SECRETS_KEK_FILE: /data/secrets/kek.bin
      TRSTCTL_AUDIT_SIGNING_KEY_FILE: /data/audit/signing-key.pem
      TRSTCTL_SERVER: "https://trstctl:8443"
      TRSTCTL_DEMO_URL: "https://localhost:9443"
      TRSTCTL_TENANT: "11111111-1111-4111-8111-111111111111"
      TRSTCTL_DEMO_BOOTSTRAP_TOKEN_FILE: /seed-state/bootstrap.token
      # Node verifies the exact public certificate exported by the healthy
      # control plane. Never use NODE_TLS_REJECT_UNAUTHORIZED=0 here.
      NODE_EXTRA_CA_CERTS: /public-trust/control-plane.crt
    volumes:
      - signersock:/run/trstctl
      # Read-only is deliberate: a healthy control plane proves these files
      # already exist, and an admin job must fail rather than mint a new domain.
      - secrets:/data/secrets:ro
      - publictrust:/public-trust:ro
      # The seed's own bootstrap bearer is persisted separately from signer/KEK
      # custody. Replays reuse it, so an ordinary compose restart does not mint a
      # new admin token merely to discover that the seed already completed.
      - seedstate:/seed-state

volumes:
  pgdata:
  natsdata:
  localstack:
  signersock:
  signerkeys:
  seedstate:
  secrets:
  trstctldata:
  publictrust:
  demoidp:
  managedkeys:
