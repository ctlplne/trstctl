# trstctl attested issuance for GitHub Actions (epic I3).
#
# The workflow proves WHO IT IS with its ambient GitHub OIDC token; trstctl's
# github_oidc attestor verifies the token against GitHub's JWKS (issuer,
# audience, expiry, and — when configured — the allowed repository owners) and
# only then signs. The pipeline never holds a CA credential: the API token it
# carries is scoped to certs:issue, and the OIDC attestation is what says
# WHICH workflow, repository and ref asked.
#
# With a self-authenticating github_oidc trust source on the server (A84) the
# pipeline holds no trstctl secret at all: the OIDC token is both the
# attestation and the bearer credential, and the workflow names its tenant.
#
# The private key is generated INSIDE the runner and never leaves it. Only the
# public key travels; the certificate comes back.
name: "trstctl attested issuance"
description: >-
  Issue a short-lived X.509 certificate from trstctl using this workflow's
  GitHub OIDC identity. The private key never leaves the runner.
branding:
  icon: "lock"
  color: "blue"
inputs:
  url:
    description: "trstctl base URL, e.g. https://trstctl.example.com"
    required: true
  token:
    description: >-
      trstctl API token scoped to certs:issue (store it as a repository secret).
      Leave it empty to issue on the OIDC attestation alone and set 'tenant' instead.
    required: false
    default: ""
  tenant:
    description: >-
      trstctl tenant ID whose self-authenticating github_oidc trust source admits
      this repository's owner. Used when 'token' is empty: the OIDC token is then
      sent as the bearer credential with this tenant in X-Tenant-ID.
    required: false
    default: ""
  audience:
    description: "OIDC audience; must match the attestation source's configured audience"
    required: false
    default: "trstctl"
  ttl-seconds:
    description: "requested certificate lifetime in seconds"
    required: false
    default: "3600"
  out-dir:
    description: "directory to write key.pem and certificate.pem into"
    required: false
    default: "trstctl-credentials"
outputs:
  certificate:
    description: "path of the issued certificate PEM"
    value: ${{ steps.issue.outputs.certificate }}
  key:
    description: "path of the private key PEM (never left the runner)"
    value: ${{ steps.issue.outputs.key }}
runs:
  using: "composite"
  steps:
    - id: issue
      shell: bash
      env:
        TRSTCTL_URL: ${{ inputs.url }}
        TRSTCTL_TOKEN: ${{ inputs.token }}
        TRSTCTL_TENANT: ${{ inputs.tenant }}
        TRSTCTL_AUDIENCE: ${{ inputs.audience }}
        TRSTCTL_TTL_SECONDS: ${{ inputs.ttl-seconds }}
        TRSTCTL_OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        for required in GITHUB_RUN_ID GITHUB_RUN_ATTEMPT GITHUB_EVENT_PATH; do
          if [ -z "${!required:-}" ]; then
            echo "::error::GitHub did not provide $required; refusing an unbound issuance request" >&2
            exit 1
          fi
        done
        for coordinate in "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"; do
          if [[ ! "$coordinate" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::GitHub run ID and attempt must be canonical positive decimal strings" >&2
            exit 1
          fi
        done

        # pull_request_target can expose upstream secrets while a fork controls
        # the proposed code. Refuse fork PRs locally before requesting OIDC; the
        # server's allowed_owners check remains the cryptographic boundary.
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          if jq -e '.pull_request.head.repo.fork == true' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "::error::attested issuance is refused for pull_request events whose .head.repo.fork is true" >&2
            exit 1
          fi
        fi

        # One of the two credential shapes must be named: an API token, or the
        # tenant whose self-authenticating trust source admits this owner.
        if [ -z "${TRSTCTL_TOKEN:-}" ] && [ -z "${TRSTCTL_TENANT:-}" ]; then
          echo "::error::set 'token' (an API token scoped to certs:issue) or 'tenant' (the trstctl tenant ID whose self-authenticating github_oidc trust source admits this repository)" >&2
          exit 1
        fi

        # The id-token: write permission is what makes the two request
        # variables exist. Failing here with the fix beats a 401 later.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::no OIDC token available: add 'permissions: id-token: write' to the job" >&2
          exit 1
        fi
        umask 077
        mkdir -p "$TRSTCTL_OUT_DIR"

        # Preserve a prior attempt's material, including a key whose response
        # was lost. Never overwrite it before discovering a repeat is refused.
        if [ -e "$TRSTCTL_OUT_DIR/certificate.pem" ] || [ -L "$TRSTCTL_OUT_DIR/certificate.pem" ]; then
          echo "::error::preserving existing runner certificate; inspect the prior attempt and use a fresh output directory" >&2
          exit 1
        fi
        # noclobber creates the key slot exclusively, including under concurrent
        # invocations. The private key stays here; only its public half travels.
        if ! (set -o noclobber; openssl ecparam -name prime256v1 -genkey -noout > "$TRSTCTL_OUT_DIR/key.pem"); then
          echo "::error::preserving existing runner key or failed key generation; inspect the output directory" >&2
          exit 1
        fi
        openssl ec -in "$TRSTCTL_OUT_DIR/key.pem" -pubout -out "$TRSTCTL_OUT_DIR/public.pem"

        OIDC_JWT="$(curl --fail --silent --show-error \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TRSTCTL_AUDIENCE}" | jq -r '.value')"

        PAYLOAD_B64="$(printf '%s' "$OIDC_JWT" | base64 | tr -d '\n')"

        # Tokenless: the OIDC token is the bearer credential and the tenant is
        # named; the server verifies it against the tenant's
        # self-authenticating trust source and binds it to payload_base64.
        AUTH_ARGS=(-H "Authorization: Bearer ${TRSTCTL_TOKEN:-$OIDC_JWT}")
        if [ -n "${TRSTCTL_TENANT:-}" ]; then
          AUTH_ARGS+=(-H "X-Tenant-ID: ${TRSTCTL_TENANT}")
        fi
        PUBKEY_JSON="$(jq -Rs '.' < "$TRSTCTL_OUT_DIR/public.pem")"
        # The server independently derives authority from the signed claims.
        # These runner values choose only the HTTP retry key, never mint rights.
        RUN_BINDING="$(printf '%s\0%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
          | openssl dgst -sha256 | awk '{print $2}')"

        HTTP_CODE="$(jq -n \
            --arg method "github_oidc" \
            --arg payload "$PAYLOAD_B64" \
            --argjson pubkey "$PUBKEY_JSON" \
            --argjson ttl "$TRSTCTL_TTL_SECONDS" \
            '{method: $method, payload_base64: $payload, public_key_pem: $pubkey, ttl_seconds: $ttl}' \
          | curl --silent --show-error --output "$TRSTCTL_OUT_DIR/response.json" --write-out '%{http_code}' \
            -X POST "${TRSTCTL_URL%/}/api/v1/workloads/attested-issuance" \
            "${AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: gha-${RUN_BINDING}" \
            --data-binary @-)"
        if [ "$HTTP_CODE" != "201" ]; then
          echo "::error::attested issuance failed with HTTP $HTTP_CODE: $(cat "$TRSTCTL_OUT_DIR/response.json")" >&2
          exit 1
        fi
        jq -r '.certificate_pem' "$TRSTCTL_OUT_DIR/response.json" > "$TRSTCTL_OUT_DIR/certificate.pem"
        rm -f "$TRSTCTL_OUT_DIR/response.json" "$TRSTCTL_OUT_DIR/public.pem"
        echo "certificate=$TRSTCTL_OUT_DIR/certificate.pem" >> "$GITHUB_OUTPUT"
        echo "key=$TRSTCTL_OUT_DIR/key.pem" >> "$GITHUB_OUTPUT"
