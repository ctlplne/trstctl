# golangci-lint v2 configuration.
#
# The standard linter set (errcheck, govet, ineffassign, staticcheck, unused) —
# the same set the project has always used — plus gosec (G1xx-G6xx, the
# CWE-mapped Go security rules) and the architecture linter (tools/trstctllint)
# which runs separately via `make lint`. golangci-lint v2 is required for
# Go 1.25.
#
# No exclusions: errcheck is fully strict. Every ignored error is acknowledged
# explicitly at its call site (`_ = f()`), so a genuinely-dropped error is never
# silently muted by a name-pattern exclusion, and any new unchecked error fails
# the build.
#
# gosec runs with no rule or path exclusions either. A finding is either fixed
# or carries an inline `#nosec G### -- reason` at the exact call site, and every
# such waiver must have a matching entry in docs/security/cwe-register.md — a
# guard test (docs/security) fails on an unregistered or reasonless #nosec.
version: "2"

linters:
  default: standard
  enable:
    - gosec

# Report EVERY finding, always.
#
# golangci-lint defaults to max-issues-per-linter: 50 and max-same-issues: 3, and
# this file used to set neither. Those defaults are not cosmetic: they are a
# silent exclusion that contradicts the "No exclusions" paragraph above. A run
# can report green-ish while hiding a regression behind the cap, and reviewers
# read the printed count as the total.
#
# This is not hypothetical. An audit of ee/ was filed as "73 issues (50 gosec)"
# because that is what the capped run printed; the real count with the caps
# removed was 197. Every conclusion drawn from the capped number was wrong by a
# factor of nearly three.
#
# docs/golangci_caps_test.go asserts both stay 0, so this cannot silently revert.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
