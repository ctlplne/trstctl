# golangci-lint v2 configuration.
#
# The standard linter set (errcheck, govet, ineffassign, staticcheck, unused) —
# the same set the project has always used — plus gosec (including G7xx taint
# analyzers and CWE-mapped Go security rules) and the architecture linter (tools/trstctllint)
# which runs separately via `make lint`. golangci-lint v2 is required for
# Go 1.25.
#
# errcheck is fully strict. Every ignored error is acknowledged
# explicitly at its call site (`_ = f()`), so a genuinely-dropped error is never
# silently muted by a name-pattern exclusion, and any new unchecked error fails
# the build.
#
# This file adds no gosec rule/path exclusions. The pinned golangci-lint v2.12.2
# integration itself disables G407 and filters generated-file findings by
# default. Its discarded internal gosec logger also limits visibility of SSA
# analyzer failures. A clean outer report does not prove every rule completed.
# Standalone gosec, generated-source checks and independent review must account
# for those gaps when qualifying a candidate. Both core and ee/ are scanned;
# the separate ee-lint-ratchet target enforces the EE baseline.
# Inline `#nosec G### -- reason` waivers remain effective. Every waiver must have
# a matching entry in docs/security/cwe-register.md; docs/security tests reject
# an unregistered or reasonless annotation.
version: "2"

linters:
  default: standard
  enable:
    - gosec

# Report EVERY finding, always.
#
# golangci-lint defaults to max-issues-per-linter: 50 and max-same-issues: 3, and
# this file used to set neither. Those defaults are not cosmetic: they are a
# silent report filter that hides findings from review. A run
# can report green-ish while hiding a regression behind the cap, and reviewers
# read the printed count as the total.
#
# This is not hypothetical. An audit of ee/ was filed as "73 issues (50 gosec)"
# because that is what the capped run printed; the real count with the caps
# removed was 197. Every conclusion drawn from the capped number was wrong by a
# factor of nearly three.
#
# docs/golangci_caps_test.go asserts both stay 0, so this cannot silently revert.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
